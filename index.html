<style>
:root{--green:#087f23;--green2:#0b6b20;--light:#eaf5e8;--line:#c7d9c5;--text:#172018;--muted:#657065;--danger:#b42318;--amber:#a15c00}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f7f4;color:var(--text)}header{background:var(--green);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 7px #0002}header h1{margin:0;font-size:20px}header small{opacity:.9}.wrap{max-width:980px;margin:auto;padding:14px}.nav{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.nav button{white-space:nowrap}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0000000a}h2,h3{margin:4px 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{font-weight:700;font-size:13px}input,select,textarea{width:100%;margin-top:5px;padding:11px;border:1px solid #b8c7b7;border-radius:8px;font-size:16px;background:#fff}textarea{min-height:80px;resize:vertical}button{border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer;background:#e5ece4;color:#173019}button.primary{background:var(--green);color:#fff}button.danger{background:#fde8e7;color:var(--danger)}button.amber{background:#fff0d7;color:#7b4700}.actions{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.ok{background:#dff4e2;color:#176b25}.minor{background:#fff0d7;color:#8a4b00}.def{background:#fde1df;color:#a61b12}.na{background:#e8ece8;color:#566156}.due{background:#fff0d7;color:#7b4700}.status-fit{background:#dff4e2;color:#176b25}.status-minor{background:#fff0d7;color:#8a4b00}.status-do-not-use{background:#fde1df;color:#a61b12}.repair-complete{background:#dff4e2;color:#176b25;font-weight:700}.repair-outstanding{background:#fff0d7;color:#8a4b00;font-weight:700}.repair-due{background:#fff0d7;color:#7b4700;font-weight:700}.check{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.checkhead{display:grid;grid-template-columns:34px 1fr;gap:8px}.num{font-weight:800;color:var(--green)}.choices{display:flex;gap:7px;margin-top:9px}.choices button{flex:1}.choices button.sel-ok{background:#bde8c4}.choices button.sel-def{background:#f5b7b2}.choices button.sel-na{background:#d6dcd6}.hidden{display:none}.muted{color:var(--muted);font-size:13px}.plantrow,.dayrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);padding:11px;border-radius:9px;margin:7px 0}.plantrow strong{display:block}.mini{font-size:12px}.statusbox{padding:10px;border-radius:9px;background:var(--light);margin:8px 0}.sig{border:1px dashed #8da08c;border-radius:8px;background:#fff;width:100%;height:150px;touch-action:none}.email-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:650px){.email-grid{grid-template-columns:1fr}}.recipient{border:1px solid var(--line);padding:8px;border-radius:8px;background:#fafcf9}.recipient label{font-weight:600}.photo-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.photo-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.photo-thumb{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);border-radius:7px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#18301b;color:#fff;padding:12px 16px;border-radius:10px;display:none;z-index:50}.dangerText{color:var(--danger);font-weight:700}.report{background:#fff;padding:24px;max-width:900px;margin:0 auto}.report table{width:100%;border-collapse:collapse;font-size:12px}.report th,.report td{border:1px solid #bbb;padding:5px;vertical-align:top}.report th{background:#eaf5e8}.report h1{color:#087f23}.declarations{margin-top:18px;padding:12px;border:1px solid #bbb;border-radius:8px}.report-signature{display:block;max-width:320px;width:320px;height:110px;object-fit:contain;border:1px solid #bbb;background:#fff}.signature-line{display:inline-block;width:320px;height:110px;border-bottom:1px solid #777;padding-top:70px;color:#777;font-size:12px}.no-print{display:block}@media print{body{background:#fff}.no-print{display:none!important}.report{padding:0;max-width:none}.pagebreak{break-before:page}}
</style></head>
<body>
<header><h1>DGS PUWER Plant Checks</h1><small>Daily plant inspections • reports</small></header>
<div class="wrap" id="app"></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>

const UNIVERSAL=[
"Operator’s manual, inspection records and required examination/certification available and in date",
"General condition; no visible structural damage, cracked welds, distortion, missing parts or loose fixings",
"Access steps, ladders, handrails, platforms and anti-slip surfaces secure and clean",
"Guards, covers, interlocks and safety devices fitted, secure and functional",
"Cab, ROPS/FOPS or operator station undamaged; doors, windows and mirrors serviceable",
"Seat and seat belt/restraint secure and operational",
"Visibility aids, cameras, wipers, washers and demisters operational",
"Horn, beacon, lights, indicators, reversing alarm and other warnings operational",
"Emergency stops, isolation devices, keys and security controls functional and identified",
"Tyres/wheels or tracks/rollers/sprockets in acceptable condition and correctly secured/tensioned",
"Steering, service brake, parking brake and travel controls function correctly",
"Engine, battery, exhaust and cooling system secure; no abnormal noise, smoke or overheating",
"Fuel, oil, coolant, hydraulic fluid and other levels acceptable",
"No fuel, oil, coolant, air, vacuum, slurry or hydraulic leaks",
"Hoses, pipes, cables, couplings, connectors and retaining devices undamaged and secure",
"Rated capacity, operating limits, decals and safety signs present and legible",
"Fire extinguisher, spill kit and first-response equipment present where required and serviceable",
"Safe start-up and function test completed; gauges and fault indicators normal"
];
const SPEC={
"Excavator":"Boom/dipper/bucket, slew area, slew lock, track condition, quick hitch and auxiliary lines",
"Dozer":"Blade, push arms, ripper, tracks, access/egress and reversing visibility",
"Piling rig":"Mast/leader, ropes/chains, winches, crowd system, stability/levelling, guards and emergency stops",
"Articulated dump truck (ADT)":"Articulation joint/lock, body and tailgate, hoist, tyres, brakes, steering and body-down indicator",
"Powder silo trailer":"Tank/body, legs, pressure relief, gauges, hoses/couplings, earthing, dust control and discharge valves",
"Generator":"Electrical enclosure, outlets, leads, earthing arrangements, emergency stop, ventilation and fuel system",
"Pump":"Suction/discharge hoses, couplings, guards, priming, strainers, leaks and safe discharge route",
"Fuel tank / bowser":"Tank integrity, bunding, cap/vents, hose/nozzle, valves, labels, earthing and spill equipment",
"Vacuum tank":"Tank condition, vacuum/pressure controls, relief devices, hoses, closures, valves and contents identification",
"Tractor":"Three-point linkage, PTO guard, drawbar, hydraulics, tyres, brakes and road/field lighting",
"Roller":"Drum/tyres, scraper bars, vibration system, water spray, articulation and edge visibility",
"Telehandler":"Boom/forks, carriage and locking, load chart, rated capacity indicator/limiter, stabilisers and attachment recognition",
"ATV":"Tyres, steering, brakes, throttle return, guards, racks, lights and operator protection specified by manufacturer",
"Loading shovel":"Loader arms, bucket, linkage, articulation joint/lock, tyres and reversing aids",
"Crusher":"Feed hopper, guards, conveyors, pull wires/interlocks, emergency stops, blockages and dust suppression",
"Screener":"Decks, guards, conveyors, belts/rollers, emergency stops, access platforms and dust controls",
"Wirtgen / milling machine":"Milling drum and guards, conveyors, water spray, levelling sensors, emergency stops and edge protection",
"Tractor and spreader":"PTO/drive guards, hopper/body, spreader mechanism, calibration/controls, hydraulics and exclusion area",
"Tractor and Stehr dust free stabiliser":"PTO and drive guards, three-point linkage, hydraulic connections, stabiliser rotor and housing, dust-control system, hoses, spray nozzles, hopper, controls and exclusion area"
};
const DEFAULT_RECIPIENTS=[
['Plant Manager','craig@dgs.co.uk'],['Plant dept','plant@dgs.co.uk'],['HSE','mick@dgs.co.uk'],['HSE Admin','simona@dgs.co.uk'],
['Site manager','Brandon.Hayes@dgs.co.uk'],['Site manager','Craig.Ackerman@dgs.co.uk'],['Site manager','George@dgs.co.uk'],['Site manager','Ian@dgs.co.uk'],['Site manager','Jim@dgs.co.uk'],['Site manager','Phillip@dgs.co.uk'],['Site manager','Shaun.Elliot@dgs.co.uk'],['Site manager','Shaun@dgs.co.uk']];
const KEY='dgs-puwer-v3';
function uid(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){const old=localStorage.getItem('dgs-puwer-v2')||localStorage.getItem('dgs-puwer-v1'); state=old?JSON.parse(old):{plants:[],inspections:[],recipients:DEFAULT_RECIPIENTS};}
state.plants??=[];state.inspections??=[];state.recipients??=DEFAULT_RECIPIENTS;
let db=null, centralEnabled=false;
try{ if(window.DGS_SUPABASE_URL && window.DGS_SUPABASE_KEY && window.supabase){ db=window.supabase.createClient(window.DGS_SUPABASE_URL,window.DGS_SUPABASE_KEY); centralEnabled=true; } }catch(e){ console.warn('Central database disabled',e); }
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
function save(){saveLocal(); if(centralEnabled) syncStateToCloud().catch(e=>console.warn('Cloud sync failed',e));}
async function loadFromCloud(){
  if(!centralEnabled) return;
  const [{data:ps,error:pe},{data:is,error:ie}]=await Promise.all([
    db.from('plants').select('*').order('created_at'),
    db.from('inspections').select('*').order('inspection_date')
  ]);
  if(pe||ie) throw (pe||ie);
  state.plants=(ps||[]).map(p=>({id:p.id,list:p.plant_list,name:p.fleet_name,type:p.plant_type,site:p.site,make:p.make_model}));
  state.inspections=(is||[]).map(i=>{const d=i.data||{};d.id=i.id;d.plantId=i.plant_id;d.date=i.inspection_date;d.time=i.inspection_time;return d});
  saveLocal();
}
async function syncStateToCloud(){
  if(!centralEnabled) return;
  const plantRows=state.plants.map(p=>({id:p.id,plant_list:p.list||'DGS Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',updated_at:new Date().toISOString()}));
  if(plantRows.length){const {error}=await db.from('plants').upsert(plantRows,{onConflict:'id'});if(error)throw error;}
  const inspRows=state.inspections.map(d=>({id:d.id,plant_id:d.plantId,inspection_date:d.date,inspection_time:d.time||'',data:d,updated_at:new Date().toISOString()}));
  if(inspRows.length){const {error}=await db.from('inspections').upsert(inspRows,{onConflict:'id'});if(error)throw error;}
}
async function refreshCloud(){if(!centralEnabled)return;try{await loadFromCloud();home()}catch(e){console.warn('Cloud refresh failed',e);toast('Central database unavailable — using this device data');}}

function esc(s=''){s=String(s??'');return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function dateNow(){return new Date().toISOString().slice(0,10)} function timeNow(){return new Date().toTimeString().slice(0,5)}
let current=null;
function appHome(){document.getElementById('app').innerHTML=`<div class="nav"><button class="primary" onclick="home()">Dashboard</button><button onclick="newPlant()">+ Add plant</button><button onclick="recipients()">Email recipients</button><button onclick="refreshCloud()">↻ Refresh shared data</button></div><div class="card"><h2>Filter plant</h2><div class="grid"><label>Site name<select id="dashSiteFilter" onchange="renderDashboard()"><option value="">All sites</option></select></label><label>Fleet number / name<select id="dashFleetFilter" onchange="renderDashboard()"><option value="">All plant</option></select></label></div><div class="actions" style="margin-top:10px"><button onclick="clearDashboardFilters()">Clear filters</button></div></div><div class="card"><h2>Today's inspections</h2><div id="todayList"></div></div><div class="card"><h2>Active plant</h2><div id="plantList"></div></div><div class="card"><h2>Send report</h2><p class="muted">Choose a plant and date range to create a combined report from completed daily inspections.</p><button class="primary" onclick="weeklyReport()">Send report</button></div>`;populateDashboardFilters();renderDashboard()}
function home(){appHome()}
function populateDashboardFilters(){const siteEl=document.getElementById('dashSiteFilter'),fleetEl=document.getElementById('dashFleetFilter');if(!siteEl||!fleetEl)return;const currentSite=siteEl.value,currentFleet=fleetEl.value;const sites=[...new Set(state.plants.map(p=>p.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));const fleets=[...new Set(state.plants.map(p=>p.name).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));siteEl.innerHTML='<option value="">All sites</option>'+sites.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');fleetEl.innerHTML='<option value="">All plant</option>'+fleets.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(sites.includes(currentSite))siteEl.value=currentSite;if(fleets.includes(currentFleet))fleetEl.value=currentFleet}
function clearDashboardFilters(){const s=document.getElementById('dashSiteFilter'),f=document.getElementById('dashFleetFilter');if(s)s.value='';if(f)f.value='';renderDashboard()}
function statusClass(status){if(status==='Fit for use')return 'status-fit';if(status==='Fit for use with recorded minor defect(s)')return 'status-minor';if(status==='Do not use — isolated / quarantined' || status==='Do not use')return 'status-do-not-use';return 'due'}
function repairStatusClass(status){return status==='Repair Complete'?'repair-complete':status==='Repair outstanding'?'repair-outstanding':'repair-due'}
function repairBadgeHTML(status){if(status==='Repair Complete')return '<span class="pill repair-complete">Repair Complete</span>';if(status==='Repair outstanding')return '<span class="pill repair-outstanding">Repair outstanding</span>';return ''}
function renderDashboard(){const site=(document.getElementById('dashSiteFilter')?.value||'').trim();const fleet=(document.getElementById('dashFleetFilter')?.value||'').trim();const matches=p=>(!site||String(p.site||'')===site)&&(!fleet||String(p.name||'')===fleet);const t=dateNow();const tl=document.getElementById('todayList');const completed=state.inspections.filter(x=>x.date===t);const today=(list)=>state.plants.filter(p=>(p.list||'DGS Plant')===list&&matches(p)).map(p=>{const i=completed.find(x=>x.plantId===p.id);return `<div class="dayrow"><div><strong>${esc(p.name||p.make+' '+p.model)}</strong><div class="mini">${esc(p.type)}</div><div class="mini">${esc(p.site||'')}</div></div><div>${i?`<span class="pill ${statusClass(i.status)}">${esc(i.status)}</span>${repairBadgeHTML(i.repair?.status)}<button onclick="editInspection('${i.id}')">View</button>`:`<span class="pill due">Due</span><button class="primary" onclick="newInspection('${p.id}')">Complete</button>`}</div></div>`}).join('')||'<p class="muted">No plant matches the selected filters.</p>';tl.innerHTML=`<h3>DGS Plant</h3>${today('DGS Plant')}<h3 style="margin-top:18px">Hired Plant</h3>${today('Hired Plant')}`;const pl=document.getElementById('plantList');const section=(list)=>{const ps=state.plants.filter(p=>(p.list||'DGS Plant')===list&&matches(p));return `<h3>${list}</h3>`+(ps.length?ps.map(p=>{const ins=state.inspections.filter(i=>i.plantId===p.id).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="plantrow"><div><strong>${esc(p.name||[p.make,p.model].filter(Boolean).join(' '))}</strong><div class="mini">${esc(p.type)}</div><div class="mini">${esc(p.site||'')} • ${ins.length} inspection(s) stored</div></div><div class="actions"><button onclick="plantHistory('${p.id}')">History</button><button class="primary" onclick="newInspection('${p.id}')">Today's check</button></div></div>`}).join(''):'<p class="muted">No plant matches the selected filters.</p>')};pl.innerHTML=section('DGS Plant')+section('Hired Plant')}
function newPlant(){document.getElementById('app').innerHTML=`<div class="nav"><button onclick="home()">← Dashboard</button></div><div class="card"><h2>Add plant</h2><div class="grid"><label>Plant list<select id="plist"><option value="DGS Plant">DGS Plant</option><option value="Hired Plant">Hired Plant</option></select></label><label>Project / Site<input id="psite"></label><label>Plant type<select id="ptype"><option value="">Select...</option>${Object.keys(SPEC).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label>Make / Model<input id="pmodel"></label><label>Fleet number / name<input id="pname" placeholder="e.g. DGS-024 PC210"></label></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="savePlant()">Save plant</button></div></div>`}
function savePlant(){const p={id:uid(),list:val('plist')||'DGS Plant',name:val('pname'),type:val('ptype'),site:val('psite'),make:val('pmodel')};if(!p.type||!p.name){toast('Enter plant name and type');return}state.plants.push(p);save();toast('Plant saved');home()}
function val(id){return document.getElementById(id)?.value.trim()||''}
function newInspection(pid){try{const p=state.plants.find(x=>String(x.id)===String(pid));if(!p){toast('Plant not found — please return to the dashboard and try again');return}const existing=state.inspections.find(x=>String(x.plantId)===String(pid)&&x.date===dateNow());if(existing){editInspection(existing.id);return}renderForm({id:uid(),plantId:p.id,date:dateNow(),time:timeNow(),details:{site:p.site||'',plantType:p.type||'',make:p.make||'',fleet:p.name||'',operator:'',supervisor:''},checks:UNIVERSAL.map(()=>''),spec:'',comments:{},defects:[],status:'',operatorSig:'',supervisorSig:'',repair:{}})}catch(e){console.error(e);toast("Could not open today's check: "+e.message)}}
function renderForm(d){
 current=d;
 d.checkPhotos??={};
 const p=state.plants.find(x=>x.id===d.plantId);
 document.getElementById('app').innerHTML=`<div class="nav"><button onclick="home()">← Dashboard</button></div><div class="card"><h2>PUWER Daily Inspection</h2><div class="statusbox"><strong>${esc(p.name)}</strong><br><span class="muted">${esc(d.date)} ${esc(d.time)} • ${esc(p.type)}</span></div><div class="grid"><label>Project / Site<input id="site" value="${esc(d.details.site)}"></label><label>Date<input id="date" type="date" value="${esc(d.date)}"></label><label>Time<input id="time" type="time" value="${esc(d.time)}"></label><label>Plant type<input value="${esc(d.details.plantType)}" disabled></label><label>Make / Model<input id="make" value="${esc(d.details.make)}"></label><label>Engine hours / Odometer<input id="hours" value="${esc(d.details.hours||'')}"></label><label>Operator<input id="operator" value="${esc(d.details.operator)}"></label><label>Supervisor<input id="supervisor" value="${esc(d.details.supervisor)}"></label></div></div><div class="card"><h2>Universal Pre-use Inspection</h2><p class="muted">Mark each item OK, Defect or N/A. If Defect is selected, add a comment and attach photos if required.</p>${UNIVERSAL.map((q,i)=>checkHTML(i,q,d.checks[i],d.comments['u'+i]||'',true)).join('')}</div><div class="card"><h2>Plant-specific check</h2><p><strong>${esc(p.type)}</strong><br>${esc(SPEC[p.type]||'No plant-specific prompt configured.')}</p>${checkHTML(100,SPEC[p.type]||'Plant-specific check',d.spec,d.comments.spec||'',false)}</div><div class="card"><h2>Defects, Isolation & Corrective Action</h2><p class="muted">Defects selected during the inspection are automatically added below. You can add or edit additional details.</p><div id="defects">${(d.defects?.length?d.defects:[]).map((x,i)=>defectHTML(x,i)).join('')}</div><button onclick="addDefect()">+ Add defect</button></div><div class="card"><h2>Inspection Outcome & Sign-off</h2><label>Plant status<select id="status" class="${statusClass(d.status)}" onchange="this.className=statusClass(this.value)"><option value="">Select...</option><option ${d.status==='Fit for use'?'selected':''}>Fit for use</option><option ${d.status==='Fit for use with recorded minor defect(s)'?'selected':''}>Fit for use with recorded minor defect(s)</option><option ${d.status==='Do not use'?'selected':''}>Do not use — isolated / quarantined</option></select></label><h3>Operator declaration</h3><p class="muted">I have completed the applicable checks and reported all defects.</p><input id="opname" placeholder="Operator name" value="${esc(d.details.operator||'')}"><canvas id="opsig" class="sig"></canvas><button onclick="clearSig('opsig')">Clear signature</button><h3>Supervisor / authorised person</h3><input id="supname" placeholder="Name" value="${esc(d.details.supervisor||'')}"><canvas id="supsig" class="sig"></canvas><button onclick="clearSig('supsig')">Clear signature</button><h3>Repair close-out</h3><div class="grid"><label>Released by<select id="released">${recipientOptions(d.repair?.released||'')}</select></label><label>Date/time<input id="releasedtime" type="datetime-local" value="${esc(d.repair?.time||'')}"></label><label>Repair status<select id="repairstatus" class="${repairStatusClass(d.repair?.status||'')}" onchange="this.className=repairStatusClass(this.value)"><option value="">Select...</option><option value="Repair outstanding" ${d.repair?.status==='Repair outstanding'?'selected':''}>Repair outstanding</option><option value="Repair Complete" ${d.repair?.status==='Repair Complete'?'selected':''}>Repair Complete</option></select></label></div></div><div class="card"><div class="actions"><button class="primary" onclick="saveInspection()">Save daily inspection</button><button onclick="saveAndNew()">Save & return</button></div></div>`;
 setupSig('opsig',d.operatorSig);setupSig('supsig',d.supervisorSig);
}
function checkHTML(i,q,v,comment,univ){const key=univ?'u'+i:'spec';const photos=current?.checkPhotos?.[key]||[];return `<div class="check"><div class="checkhead"><div class="num">${univ?i+1:'P'}</div><div>${esc(q)}</div></div><div class="choices"><button class="${v==='OK'?'sel-ok':''}" onclick="setCheck('${key}','OK',this)">OK</button><button class="${v==='Defect'?'sel-def':''}" onclick="setCheck('${key}','Defect',this)">Defect</button><button class="${v==='N/A'?'sel-na':''}" onclick="setCheck('${key}','N/A',this)">N/A</button></div><textarea placeholder="Comments / defect reference" data-comment="${key}" ${v==='Defect'?'':'style="display:none"'}>${esc(comment)}</textarea><div id="photos-${key}" class="${v==='Defect'?'':'hidden'}"><div class="photo-actions"><button type="button" onclick="document.getElementById('file-${key}').click()">📁 Add photo from file</button><button type="button" onclick="document.getElementById('camera-${key}').click()">📷 Take photo</button><input id="file-${key}" type="file" accept="image/*" multiple style="display:none" onchange="addCheckPhotos('${key}',this.files)"><input id="camera-${key}" type="file" accept="image/*" capture="environment" style="display:none" onchange="addCheckPhotos('${key}',this.files)"></div><div class="photo-preview">${photos.map((src,n)=>`<img class="photo-thumb" src="${src}" alt="Defect photo ${n+1}">`).join('')}</div></div></div>`}
function setCheck(key,v,btn){if(key==='spec')current.spec=v;else current.checks[Number(key.slice(1))]=v;current.checkPhotos??={};current.comments??={};const c=btn.parentElement.parentElement.querySelector('textarea');c.style.display=v==='Defect'?'block':'none';const photoBox=btn.parentElement.parentElement.querySelector('#photos-'+key);if(photoBox)photoBox.classList.toggle('hidden',v!=='Defect');if(v!=='Defect'){c.value='';delete current.checkPhotos[key]}current.comments[key]=c.value;btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel-ok','sel-def','sel-na'));btn.classList.add(v==='OK'?'sel-ok':v==='Defect'?'sel-def':'sel-na');syncDefectsFromChecks();refreshDefects()}
function addCheckPhotos(key,files){if(!files?.length)return;current.checkPhotos??={};current.checkPhotos[key]??=[];let remaining=files.length;[...files].forEach(file=>{if(!file.type.startsWith('image/')){remaining--;return}const r=new FileReader();r.onload=e=>{compressPhoto(e.target.result,src=>{current.checkPhotos[key].push(src);remaining--;if(remaining<=0)renderForm(current);})};r.readAsDataURL(file)});}
function compressPhoto(data,done){const img=new Image();img.onload=()=>{const max=1280;const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);done(c.toDataURL('image/jpeg',0.72))};img.onerror=()=>done(data);img.src=data}
function syncDefectsFromChecks(){current.defects??=[];const keys=[...UNIVERSAL.map((q,i)=>({key:'u'+i,text:q})),{key:'spec',text:SPEC[state.plants.find(x=>x.id===current.plantId)?.type]||'Plant-specific check'}];const active=new Set();keys.forEach((x,idx)=>{const result=x.key==='spec'?current.spec:current.checks[Number(x.key.slice(1))];if(result==='Defect'){active.add(x.key);const comment=current.comments?.[x.key]||'';let item=current.defects.find(z=>z.autoKey===x.key);if(!item){item={ref:current.defects.length+1,defect:'',action:'',reported:'',target:'',closed:'',autoKey:x.key,photos:[]};current.defects.push(item)}item.defect=comment||x.text;item.photos=current.checkPhotos?.[x.key]||[]}});current.defects=current.defects.filter(x=>!x.autoKey||active.has(x.autoKey))}
function refreshDefects(){const el=document.getElementById('defects');if(!el)return;el.innerHTML=(current.defects||[]).map((x,i)=>defectHTML(x,i)).join('')}
function recipientOptions(selected){const vals=[...(state.recipients||DEFAULT_RECIPIENTS)];if(selected && !vals.some(r=>r[1]===selected)) vals.push(['Custom',selected]);return `<option value="">Select...</option>`+vals.map(([name,email])=>`<option value="${esc(email)}" ${email===selected?'selected':''}>${esc(name)} — ${esc(email)}</option>`).join('')}
function defectHTML(x,i){const photos=x.photos||[];return `<div class="check"><div class="grid"><label>Ref<input data-d="ref" value="${esc(x.ref||i+1)}"></label><label>Defect / observation<input data-d="defect" value="${esc(x.defect||'')}"></label><label>Immediate action / isolation<input data-d="action" value="${esc(x.action||'')}"></label><label>Reported to<select data-d="reported">${recipientOptions(x.reported||'')}</select></label><label>Target / completion<input data-d="target" type="date" value="${esc(x.target||'')}"></label><label>Closed by<select data-d="closed">${recipientOptions(x.closed||'')}</select></label></div>${photos.length?`<div class="photo-preview">${photos.map((src,n)=>`<img class="photo-thumb" src="${src}" alt="Defect photo ${n+1}">`).join('')}</div>`:''}</div>`}
function addDefect(){current.defects??=[];current.defects.push({ref:current.defects.length+1,defect:'',action:'',reported:'',target:'',closed:'',photos:[]});refreshDefects()}
function setupSig(id,data){const c=document.getElementById(id),ctx=c.getContext('2d');let drawing=false,last;function pos(e){const r=c.getBoundingClientRect();const t=e.touches?.[0]||e;return{x:(t.clientX-r.left)*c.width/r.width,y:(t.clientY-r.top)*c.height/r.height}};if(data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=data}const start=e=>{drawing=true;last=pos(e);e.preventDefault()},move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineWidth=2;ctx.lineCap='round';ctx.stroke();last=p;e.preventDefault()},end=()=>{drawing=false};c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end}
function clearSig(id){const c=document.getElementById(id);c.getContext('2d').clearRect(0,0,c.width,c.height);if(id==='opsig')current.operatorSig='';else current.supervisorSig=''}
function saveInspection(){const d=current;const statusEl=document.getElementById('status');const selectedStatus=val('status');if(!selectedStatus){toast('Please select the plant status before saving the inspection');statusEl?.focus();return}d.date=val('date')||dateNow();d.time=val('time')||timeNow();d.details={site:val('site'),plantType:state.plants.find(x=>x.id===d.plantId).type,make:val('make'),fleet:state.plants.find(x=>x.id===d.plantId).name,operator:val('operator')||val('opname'),supervisor:val('supervisor')||val('supname'),hours:document.getElementById('hours')?.value||''};d.checkPhotos??={};document.querySelectorAll('[data-comment]').forEach(t=>d.comments[t.dataset.comment]=t.value);syncDefectsFromChecks();d.defects=[...document.querySelectorAll('#defects .check')].map((el,i)=>{const old=current.defects[i]||{};const o={...old};el.querySelectorAll('[data-d]').forEach(x=>o[x.dataset.d]=x.value);o.photos=old.photos||[];return o});d.status=selectedStatus;d.operatorSig=document.getElementById('opsig').toDataURL();d.supervisorSig=document.getElementById('supsig').toDataURL();d.repair={released:val('released'),time:val('releasedtime'),status:val('repairstatus')};const idx=state.inspections.findIndex(x=>x.id===d.id);if(idx>=0)state.inspections[idx]=d;else state.inspections.push(d);save();toast('Inspection saved');setTimeout(home,500)}

function plantHistory(pid){const p=state.plants.find(x=>x.id===pid);const ins=state.inspections.filter(x=>x.plantId===pid).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('app').innerHTML=`<div class="nav"><button onclick="home()">← Dashboard</button></div><div class="card"><h2>${esc(p.name)} — History</h2><div class="actions"><button class="primary" onclick="newInspection('${pid}')">Today's check</button><button onclick="weeklyReport('${pid}')">Send report</button></div>${ins.length?ins.map(i=>`<div class="dayrow"><div><strong>${esc(i.date)}</strong><div class="mini">${esc(i.details.operator||'')} • ${esc(i.details.site||'')}</div></div><div><span class="pill ${statusClass(i.status)}">${esc(i.status||'Incomplete')}</span>${repairBadgeHTML(i.repair?.status)} <button onclick="editInspection('${i.id}')">View</button></div></div>`).join(''):'<p class="muted">No completed inspections.</p>'}</div>`}
function recipients(){document.getElementById('app').innerHTML=`<div class="nav"><button onclick="home()">← Dashboard</button></div><div class="card"><h2>Email recipients</h2><p class="muted">Select one or more recipients when sending a report. You can also add a new address.</p><div id="recips" class="email-grid">${state.recipients.map((r,i)=>`<div class="recipient"><label><input type="checkbox" data-r="${i}"> ${esc(r[0])}</label><div class="mini">${esc(r[1])}</div></div>`).join('')}</div><hr><h3>Add new email</h3><div class="grid"><label>Name<input id="rname"></label><label>Email<input id="remail" type="email"></label></div><button style="margin-top:10px" onclick="addRecipient()">Add recipient</button></div>`}
function addRecipient(){const n=val('rname'),e=val('remail');if(!n||!e||!e.includes('@')){toast('Enter a name and valid email');return}state.recipients.push([n,e]);save();toast('Recipient added');recipients()}
function weeklyReport(pid){const plants=pid?[state.plants.find(x=>x.id===pid)]:state.plants;const sites=[...new Set(plants.filter(Boolean).map(p=>p.site).filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));document.getElementById('app').innerHTML=`<div class="nav no-print"><button onclick="home()">← Dashboard</button></div><div class="card no-print"><h2>Report</h2><div class="grid"><label>Plant list<select id="wrlist"><option value="">All plant</option><option value="DGS Plant">DGS Plant</option><option value="Hired Plant">Hired Plant</option></select></label><label>Site<select id="wrsite"><option value="">All sites</option>${sites.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label><label>Defects reported<select id="wrdefects"><option value="">All inspections</option><option value="yes">Defects reported</option><option value="no">No defects reported</option><option value="repair-outstanding">Repair Outstanding</option><option value="repair-complete">Repair Complete</option></select></label><label>Plant<select id="wrplant"><option value="">All plants</option>${plants.filter(Boolean).map(p=>`<option value="${p.id}">${esc(p.list||'DGS Plant')} — ${esc(p.name)}</option>`).join('')}</select></label><label>From<input id="wrfrom" type="date" value="${new Date(Date.now()-6*864e5).toISOString().slice(0,10)}"></label><label>To<input id="wrto" type="date" value="${dateNow()}"></label></div><div class="actions" style="margin-top:10px"><button class="primary" onclick="buildReport()">Generate report</button></div></div><div class="card no-print"><h3>Email recipients</h3><div id="reportRecipients" class="email-grid">${state.recipients.map((r,i)=>`<div class="recipient"><label><input type="checkbox" data-report-r="${i}"> ${esc(r[0])}</label><div class="mini">${esc(r[1])}</div></div>`).join('')}</div><button style="margin-top:10px" onclick="selectAllReportRecipients(true)">Select all</button> <button style="margin-top:10px" onclick="selectAllReportRecipients(false)">Clear all</button></div><div id="reportOut"></div>`}
function buildReport(){const pid=val('wrplant'),list=val('wrlist'),site=val('wrsite'),defFilter=val('wrdefects'),from=val('wrfrom'),to=val('wrto');const rows=state.inspections.filter(i=>{const p=state.plants.find(x=>x.id===i.plantId);if(!p)return false;const hasDef=Array.isArray(i.defects)&&i.defects.length>0;const repairStatus=i.repair?.status||'';const defectMatch=!defFilter||(defFilter==='yes'?hasDef:defFilter==='no'?!hasDef:defFilter==='repair-outstanding'?repairStatus==='Repair outstanding':defFilter==='repair-complete'?repairStatus==='Repair Complete':true);return (!pid||i.plantId===pid)&&(!list||(p.list||'DGS Plant')===list)&&(!site||String(p.site||'')===site)&&defectMatch&&i.date>=from&&i.date<=to}).sort((a,b)=>a.date.localeCompare(b.date));const groups={};rows.forEach(i=>(groups[i.plantId]??=[]).push(i));let html='<div class="report"><h1>DGS PUWER Plant Inspection Report</h1><p><strong>Period:</strong> '+esc(from)+' to '+esc(to)+'</p>';if(list)html+='<p><strong>Plant list:</strong> '+esc(list)+'</p>';if(site)html+='<p><strong>Site:</strong> '+esc(site)+'</p>';if(defFilter)html+='<p><strong>Defects / repair:</strong> '+(defFilter==='yes'?'Defects reported':defFilter==='no'?'No defects reported':defFilter==='repair-outstanding'?'Repair Outstanding':defFilter==='repair-complete'?'Repair Complete':'')+'</p>';if(!rows.length)html+='<p>No completed inspections found for the selected filters.</p>';for(const [pId,arr] of Object.entries(groups)){const p=state.plants.find(x=>x.id===pId);html+=`<div class="pagebreak"><h2>${esc(p.name)}</h2><p>${esc(p.type)} • ${esc(p.name||'')} • ${esc(p.site||'')}</p>`;arr.forEach((d)=>{html+=`<h3>${esc(d.date)} — ${esc(d.status||'Incomplete')}</h3><table><tr><th style="width:7%">No.</th><th>Check item</th><th style="width:10%">Result</th><th>Comments / defect</th></tr>`;UNIVERSAL.forEach((q,i)=>html+=`<tr><td>${i+1}</td><td>${esc(q)}</td><td>${esc(d.checks[i]||'')}</td><td>${esc(d.comments['u'+i]||'')}</td></tr>`);html+=`<tr><td>P</td><td>${esc(SPEC[p.type]||'Plant-specific check')}</td><td>${esc(d.spec||'')}</td><td>${esc(d.comments.spec||'')}</td></tr></table>`;if(d.defects?.length){html+='<h4>Defects / corrective action</h4><table><tr><th>Ref</th><th>Defect</th><th>Immediate action</th><th>Reported to</th><th>Target</th><th>Closed by</th></tr>';d.defects.forEach(x=>html+=`<tr><td>${esc(x.ref)}</td><td>${esc(x.defect)}</td><td>${esc(x.action)}</td><td>${esc(x.reported)}</td><td>${esc(x.target)}</td><td>${esc(x.closed)}</td></tr>`);html+='</table>';const photoItems=d.defects.flatMap(x=>x.photos||[]);if(photoItems.length){html+='<h4>Defect photographs</h4><div class="photo-preview">'+photoItems.map(src=>`<img class="photo-thumb" src="${src}" alt="Defect photograph">`).join('')+'</div>'}}html+=`<p><strong>Operator:</strong> ${esc(d.details.operator||'')} &nbsp; <strong>Supervisor:</strong> ${esc(d.details.supervisor||'')}</p>`;});html+='</div>'}html+='<div class="no-print" style="margin-top:20px"><button class="primary" onclick="window.print()">Print / Save as PDF</button> <button onclick="emailReport()">Email selected recipients</button></div></div>';document.getElementById('reportOut').innerHTML=html;window.reportRows=rows}
function selectAllReportRecipients(on){document.querySelectorAll('[data-report-r]').forEach(x=>x.checked=on)}
function emailReport(){const checks=[...document.querySelectorAll('[data-report-r]:checked')];const ids=checks.map(x=>state.recipients[Number(x.dataset.reportR)]?.[1]).filter(Boolean);if(!ids.length){toast('Select at least one recipient');return}const subject=encodeURIComponent('DGS PUWER Plant Inspection Report');const body=encodeURIComponent('Please find the completed DGS PUWER plant inspection report for the selected period.\n\nUse Print / Save as PDF first to create the PDF attachment, then attach it to this email.');window.location.href=`mailto:${ids.join(',')}?subject=${subject}&body=${body}`}

Object.assign(window,{home,appHome,newPlant,savePlant,newInspection,renderForm,setCheck,addCheckPhotos,compressPhoto,addDefect,clearSig,saveInspection,saveAndNew,editInspection,plantHistory,recipients,addRecipient,weeklyReport,buildReport,selectAllReportRecipients,emailReport,populateDashboardFilters,clearDashboardFilters,renderDashboard,repairStatusClass});
