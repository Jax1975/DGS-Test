async function loadFromCloud(){
  if(!centralEnabled) return;
  let plantsData=null, plantsError=null, inspData=null, inspError=null;
  const [{data:ps,error:pe},{data:is,error:ie}]=await Promise.all([
    db.from('plants').select('*').order('created_at'),
    db.from('inspections').select('*').order('inspection_date')
  ]);
  plantsData=ps||[]; plantsError=pe; inspData=is||[]; inspError=ie;

  // The temporary PIN/anonymous role setup can make direct table reads return an
  // empty set on projects where the access-control SQL has not fully propagated.
  // Try the secure bootstrap RPC as a fallback before deciding that the cloud is empty.
  if((plantsError || inspError || ((!plantsData.length && !inspData.length) && (state.plants.length || state.inspections.length)))){
    try{
      const {data:boot,error:be}=await db.rpc('dgs_get_puwer_bootstrap');
      if(!be && boot){
        plantsData=Array.isArray(boot.plants)?boot.plants:plantsData;
        inspData=Array.isArray(boot.inspections)?boot.inspections:inspData;
        plantsError=null; inspError=null;
      }
    }catch(e){console.warn('Bootstrap RPC unavailable',e)}
  }
  if(plantsError) throw plantsError;
  if(inspError) throw inspError;

  const pendingPlants=(state.plants||[]).filter(p=>p&&p._pendingSync);
  const cloudPlants=(plantsData||[]).map(p=>({id:p.id,list:p.plant_list,name:p.fleet_name,type:(p.plant_type==='Dry powder silo road-going trailer'?'Silo':p.plant_type),site:p.site,make:p.make_model,serial:p.serial_number||'',archived:!!p.is_archived}));
  const cloudInspections=(inspData||[]).map(i=>{const d=i.data||{};d.id=i.id;d.plantId=i.plant_id;d.date=i.inspection_date;d.time=i.inspection_time;d.createdBy=i.created_by||d.createdBy||'';return d});

  // Never erase a known local dataset because a cloud query temporarily returned no rows.
  // Keep new plant records visible on this device until the shared-table upsert succeeds.
  if(cloudPlants.length || state.plants.length===0){
    const merged=new Map(cloudPlants.map(p=>[String(p.id),p]));
    pendingPlants.forEach(p=>merged.set(String(p.id),p));
    state.plants=[...merged.values()];
  }else if(pendingPlants.length){
    const merged=new Map(state.plants.map(p=>[String(p.id),p]));
    pendingPlants.forEach(p=>merged.set(String(p.id),p));
    state.plants=[...merged.values()];
  }
  if(cloudInspections.length || state.inspections.length===0) state.inspections=cloudInspections;
  await loadSupervisorInspectionsFromCloud();
  await loadSeniorManagerInspectionsFromCloud();
  saveLocal();
}
async function loadSupervisorInspectionsFromCloud(){
  if(!centralEnabled)return;
  try{
    const {data,error}=await db.from('supervisor_inspections').select('*').order('inspection_date',{ascending:false});
    if(error){supervisorTableError=error.message||'Supervisor inspection table is unavailable';console.warn('Supervisor inspection cloud load failed',error);return}
    supervisorTableError='';
    const cloud=(data||[]).map(row=>{
      const d=row.data&&typeof row.data==='object'?row.data:{};
      return normalizeSupervisorQuestionVersion({...d,id:row.id,site:row.site||d.site||'',inspector:row.inspector_name||d.inspector||'',date:row.inspection_date||d.date||''});
    });
    const pending=(state.supervisorInspections||[]).filter(s=>s&&s._pendingSync);
    if(cloud.length || (state.supervisorInspections||[]).length===0){
      const ids=new Set(cloud.map(s=>String(s.id)));
      state.supervisorInspections=[...cloud,...pending.filter(s=>!ids.has(String(s.id)))];
    }else if(pending.length){
      const ids=new Set((state.supervisorInspections||[]).map(s=>String(s.id)));
      state.supervisorInspections.push(...pending.filter(s=>!ids.has(String(s.id))));
    }
  }catch(e){supervisorTableError=e?.message||String(e);console.warn('Supervisor inspection cloud load failed',e)}
}
async function syncSupervisorInspectionToCloud(s){
  if(!centralEnabled)throw new Error('Central database is not configured');
  const data={...s};delete data._pendingSync;
  const row={id:String(s.id),site:s.site||'',inspector_name:s.inspector||'',inspection_date:s.date||dateNow(),data,updated_at:new Date().toISOString()};
  const {error}=await db.from('supervisor_inspections').upsert([row],{onConflict:'id'});
  if(error)throw error;
}

async function syncNormalizedInspectionToCloud(d){
  if(!centralEnabled)return;
  // The full inspection JSON in public.inspections.data is the source of truth
  // for photo attachments. Do not duplicate base64 photos into the normalized
  // tables because large photo payloads can cause operator saves to fail.
  const checkRows=[];
  UNIVERSAL.forEach((q,i)=>checkRows.push({inspection_id:d.id,check_key:'u'+i,check_number:String(i+1),check_item:q,result:d.checks?.[i]||'',comment:d.comments?.['u'+i]||'',photos:[]}));
  const plant=state.plants.find(p=>String(p.id)===String(d.plantId));
  checkRows.push({inspection_id:d.id,check_key:'spec',check_number:'P',check_item:SPEC[plant?.type]||'Plant-specific check',result:d.spec||'',comment:d.comments?.spec||'',photos:[]});
  const {error:ce}=await db.from('inspection_checks').upsert(checkRows,{onConflict:'inspection_id,check_key'});
  if(ce)throw ce;

  const {error:de}=await db.from('defects').delete().eq('inspection_id',d.id);
  if(de)throw de;
  const defects=(d.defects||[]).map(x=>({inspection_id:d.id,ref:String(x.ref??''),auto_key:x.autoKey||null,defect:x.defect||'',immediate_action:x.action||'',reported_to:x.reported||'',target_completion:x.target||'',closed_by:x.closed||''}));
  if(defects.length){
    const {error:die}=await db.from('defects').insert(defects);
    if(die)throw die;
  }
}
async function syncStateToCloud(){

      const plantRows=state.plants.map(p=>({id:p.id,plant_list:p.list||'DGS Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',serial_number:p.serial||'',is_archived:!!p.archived,updated_at:new Date().toISOString()}));
      if(plantRows.length){const {error}=await db.from('plants').upsert(plantRows,{onConflict:'id'});if(error)throw error;}
    }
    const inspRows=state.inspections.map(d=>({id:d.id,plant_id:d.plantId,inspection_date:d.date,inspection_time:d.time||'',created_by:(d.createdBy||((currentUser?.id && !localAccessMode)?currentUser.id:null)),data:d,updated_at:new Date().toISOString()}));

  }finally{cloudSyncBusy=false;}
}

async function startDgsAccess(role,pin=''){
  authFlowBusy=true;
  localAccessMode=true;
  currentRole=role;
  const roleNames={admin:'Admin',plant_department:'Plant department',site_management:'Site management team',engineering_department:'Engineering department',operator:'Plant operator'};
  currentProfile={full_name: roleNames[role]||'DGS user', role, active:true};
  currentUser=null;

  try{
    // Temporary PIN/operator mode intentionally uses the same Supabase anon
    // connection that the working PUWER app used before DGS account auth was
    // introduced. Do NOT create an anonymous Auth session here: doing so changes
    // Postgres from the anon role to authenticated and can block the existing
    // shared plant/inspection policies.
    if(centralEnabled){
      try{await db.auth.signOut();}catch(_){}
      try{await loadFromCloud()}catch(e){console.warn('Cloud data unavailable in temporary access mode',e);toast('Shared database could not be loaded. Check the V44 Supabase access SQL.')}
      try{setupRealtimeSync()}catch(_){}
    }
    if(role==='admin'){mileageSession=null;mileageSessionError='';}
    portalHome();
  }catch(e){
    console.error(e);
    currentUser=null;currentProfile=null;currentRole='';
    loginScreen(e.message||'Could not start DGS access.');
  }finally{
    authFlowBusy=false;
    setHeader('DGS App','Site management portal');
  }
}

    currentUser=null;currentProfile=null;currentRole='';stopRealtimeSync();loginScreen();return;

// Migrate older 16-question records to the 17-question layout.
// The old combined Q14 answer stays against the first split question;
// the new question 15 is left blank because a separate answer was never recorded.
// Old questions 15 and 16 move to their new positions 16 and 17.
function normalizeSupervisorQuestionVersion(record){
  if(!record || Number(record.questionVersion||1)>=2)return record;
  const moveKeys=source=>{
    const old={...(source||{})},next={...old};
    if(Object.prototype.hasOwnProperty.call(old,'q16'))next.q17=old.q16;
    if(Object.prototype.hasOwnProperty.call(old,'q15'))next.q16=old.q15;
    delete next.q15;
    return next;
  };
  record.answers=moveKeys(record.answers);
  record.comments=moveKeys(record.comments);
  record.photos=moveKeys(record.photos);
  record.questionVersion=2;
  return record;
}
function normalizeAllSupervisorRecords(){
  state.supervisorInspections=(state.supervisorInspections||[]).map(normalizeSupervisorQuestionVersion);
}

function setSupervisorAnswer(key,value,btn){
  if(!supervisorCurrent)return;
  supervisorCurrent.answers??={};supervisorCurrent.answers[key]=value;
  const card=btn.closest('.supervisor-question');card?.classList.remove('required-missing');
  btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel-ok','sel-def','sel-na'));
  btn.classList.add(value==='Yes'?'sel-ok':value==='No'?'sel-def':'sel-na');
}
function supervisorAddPhotos(key,files){
  if(!supervisorCurrent||!files?.length)return;
  captureSupervisorFormFields();
  if(key==='__additional__')supervisorCurrent.additionalPhotos??=[];
  else {supervisorCurrent.photos??={};supervisorCurrent.photos[key]??=[]}
  const list=[...files];let remaining=list.length,added=0,failed=0;
  const finish=()=>{
    if(remaining<=0){
      renderSupervisorForm(supervisorCurrent);
      if(failed&&added===0)toast('Photo could not be processed on this device. Try another photo or select a JPEG image.');
      else if(added)toast(`${added} photo${added===1?'':'s'} added`);
    }
  };
  list.forEach(file=>{
    const isImage=(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif)$/i.test(file.name||'');
    if(!isImage){failed++;remaining--;finish();return}
    const reader=new FileReader();reader.onerror=()=>{failed++;remaining--;finish()};
    reader.onload=e=>compressPhoto(e.target.result,src=>{if(key==='__additional__')supervisorCurrent.additionalPhotos.push(src);else supervisorCurrent.photos[key].push(src);added++;remaining--;finish()},()=>{failed++;remaining--;finish()});
    reader.readAsDataURL(file);
  });
}
async function saveSupervisorInspection(){
  if(!requirePermission('supervisor.manage','You do not have permission to save supervisor site inspections.'))return;
  captureSupervisorFormFields();
  const s=supervisorCurrent;if(!s)return;
  const siteEl=document.getElementById('supSite'),dateEl=document.getElementById('supDate'),nameEl=document.getElementById('supInspector');
  let valid=true;
  [[siteEl,!!s.site,'Please select a site'],[dateEl,!!s.date,'Please enter the inspection date'],[nameEl,!!String(s.inspector||'').trim(),'Please enter the supervisor name']].forEach(([el,ok,msg])=>{
    if(!ok){el?.classList.add('required-missing');el?.focus?.();valid=false}
    else el?.classList.remove('required-missing');
  });
  const missing=SUPERVISOR_QUESTIONS.findIndex((_,i)=>!['Yes','No','N/A'].includes(s.answers['q'+(i+1)]||''));
  if(missing>=0){const q=document.getElementById('sup-question-q'+(missing+1));q?.classList.add('required-missing');q?.scrollIntoView({behavior:'smooth',block:'center'});q?.querySelector('.choices button')?.focus();toast('Please answer all 17 questions with Yes, No or N/A');return}
  if(!valid){toast('Please complete the required site, date and supervisor name fields');return}
  s.updatedAt=new Date().toISOString();
  const idx=(state.supervisorInspections||[]).findIndex(x=>String(x.id)===String(s.id));
  if(idx>=0)state.supervisorInspections[idx]=s;else state.supervisorInspections.push(s);
  if(centralEnabled){
    try{
      await syncSupervisorInspectionToCloud(s);
      delete s._pendingSync;supervisorTableError='';
      saveLocal();toast('Weekly supervisor inspection saved and synced');
    }catch(e){
      s._pendingSync=true;saveLocal();supervisorTableError=e?.message||String(e);
      console.warn('Supervisor inspection sync failed',e);
      toast('Inspection saved on this device but not synced: '+(e?.message||e));
    }
  }else{
    s._pendingSync=true;saveLocal();toast('Inspection saved on this device only. Shared database is not configured.');
  }
  openSupervisorDashboard();
}

function buildSupervisorReport(){
  normalizeAllSupervisorRecords();
  const site=document.getElementById('supReportSite')?.value||'',from=document.getElementById('supReportFrom')?.value||'',to=document.getElementById('supReportTo')?.value||'';
  if(from&&to&&from>to){toast('From date must be before To date');return}
  const rows=(state.supervisorInspections||[]).filter(s=>(!site||s.site===site)&&(!from||s.date>=from)&&(!to||s.date<=to)).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));
  window.supervisorReportRows=rows;
  let html=`<div class="report"><div class="report-brand"><img src="dgs-logo.jpg" alt="DGS Dynamic Ground Solutions logo"><h1>DGS Supervisor Weekly Safety Inspection Report</h1></div><p><strong>Period:</strong> ${esc(from||'Any date')} to ${esc(to||'Any date')}</p>${site?`<p><strong>Site:</strong> ${esc(site)}</p>`:''}`;
  if(!rows.length)html+='<p>No supervisor inspections found for the selected site and date range.</p>';
  rows.forEach((s,ri)=>{
    html+=`<div class="pagebreak"><h2>${esc(s.site||'Site not recorded')}</h2><p><strong>Inspection date:</strong> ${esc(s.date||'')} &nbsp; <strong>Supervisor:</strong> ${esc(s.inspector||'')}</p><table class="supervisor-report-table"><thead><tr><th style="width:5%">No.</th><th>Question</th><th style="width:12%">Answer</th><th>Comments</th></tr></thead><tbody>`;
    SUPERVISOR_QUESTIONS.forEach((q,i)=>{
      const key='q'+(i+1);html+=`<tr><td>${i+1}</td><td>${esc(q)}</td><td>${esc(s.answers?.[key]||'')}</td><td>${esc(s.comments?.[key]||'')}</td></tr>`;
    });
    html+='</tbody></table>';
    if(s.additionalComments)html+=`<p><strong>Comments / New risks identified:</strong><br>${esc(s.additionalComments).replace(/\n/g,'<br>')}</p>`;
    const photoEntries=[];
    SUPERVISOR_QUESTIONS.forEach((q,i)=>(s.photos?.['q'+(i+1)]||[]).forEach((src,n)=>photoEntries.push({label:`Question ${i+1}`,src})));
    (s.additionalPhotos||[]).forEach(src=>photoEntries.push({label:'Additional site photo',src}));
    if(photoEntries.length)html+=`<h3>Photographs</h3><div class="photo-preview">${photoEntries.map(ph=>`<div style="display:inline-block;vertical-align:top;margin:5px"><img class="photo-thumb" style="max-width:190px;max-height:150px" src="${ph.src}" alt="${esc(ph.label)}"><div class="mini">${esc(ph.label)}</div></div>`).join('')}</div>`;
    html+='</div>';
  });
  html+=`<div class="no-print" style="margin-top:20px"><button class="primary" onclick="window.print()">Print / Save as PDF</button> <button onclick="emailSupervisorReport()">Email selected recipients</button></div></div>`;
  const out=document.getElementById('supervisorReportOut');if(out)out.innerHTML=html;
}
function emailSupervisorReport(){
  const ids=[...document.querySelectorAll('[data-report-r]:checked')].map(x=>state.recipients[Number(x.dataset.reportR)]?.[1]).filter(Boolean);
  if(!ids.length){toast('Select at least one recipient');return}
  const rows=Array.isArray(window.supervisorReportRows)?window.supervisorReportRows:[];
  if(!rows.length){toast('Generate a report containing at least one inspection first');return}
  const bodyLines=['DGS SUPERVISOR WEEKLY SAFETY CHECK',''];
  rows.forEach(s=>{
    bodyLines.push(`Site: ${s.site||'Site not recorded'}`,`Date: ${s.date||''}`,`Supervisor: ${s.inspector||''}`);
    SUPERVISOR_QUESTIONS.forEach((q,i)=>{
      const k='q'+(i+1), answer=s.answers?.[k]||'Not answered', comment=s.comments?.[k]||'';
      bodyLines.push(`${i+1}. ${q}`,`Answer: ${answer}${comment?` — Comments: ${comment}`:''}`);
    });
    if(s.additionalComments)bodyLines.push(`Additional comments / new risks: ${s.additionalComments}`);
    if((s.additionalPhotos||[]).length||Object.values(s.photos||{}).some(a=>a?.length))bodyLines.push('Photographs are included in the printable/PDF report; attach the PDF separately if required.');
    bodyLines.push('','----------------------------------------','');
  });
  const recipients=[...new Set(ids.map(v=>String(v||'').replace(/[\r\n;]/g,'').trim()).filter(Boolean))];
  const to=recipients.join('; ');
  const subject=encodeURIComponent('DGS SUPERVISOR WEEKLY SAFETY CHECK');
  const body=encodeURIComponent(bodyLines.join('\n'));
  window.location.href=`mailto:${to}?subject=${subject}&body=${body}`;
}

// Migrate older 16-question records to the 17-question layout.
// The old combined Q14 answer stays against the first split question;
// the new question 15 is left blank because a separate answer was never recorded.
// Old questions 15 and 16 move to their new positions 16 and 17.
function normalizeSeniorManagerQuestionVersion(record){
  if(record)record.questionVersion=2;
  return record;
}
function normalizeAllSeniorManagerRecords(){
  state.seniorManagerInspections=(state.seniorManagerInspections||[]).map(normalizeSeniorManagerQuestionVersion);
}

function seniorManagerSiteOptions(selected=''){
  const sites=[...new Set([...siteNames(),...(state.seniorManagerInspections||[]).map(s=>s.site).filter(Boolean)])].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
  return '<option value="">Select site...</option>'+sites.map(s=>`<option value="${esc(s)}" ${String(s)===String(selected)?'selected':''}>${esc(s)}</option>`).join('')+'<option value="__ADD_NEW_SITE__">＋ Add new project / site...</option>';
}
function handleSeniorManagerSiteChange(el){
  if(!el||el.value!=='__ADD_NEW_SITE__')return;
  const name=window.prompt('Enter the new project / site name:','');
  if(name===null){el.value='';return}
  const site=String(name).trim();
  if(!site){toast('Enter a project / site name');el.value='';return}
  const existing=[...siteNames(),...(state.seniorManagerInspections||[]).map(s=>s.site)].find(x=>String(x||'').toLowerCase()===site.toLowerCase());
  if(existing){el.value=existing;toast('Existing project / site selected');return}
  const opt=document.createElement('option');opt.value=site;opt.textContent=site;
  el.insertBefore(opt,el.lastElementChild);el.value=site;
  toast('New site will be stored when you save this inspection');
}
function renderSeniorManagerDashboard(){
  normalizeAllSeniorManagerRecords();
  const host=document.getElementById('seniorManagerDashboard');
  if(!host)return;
  const siteEl=document.getElementById('seniorManagerDashSite');
  const selected=siteEl?.value||'';
  const fromEl=document.getElementById('seniorManagerDashFrom');
  const toEl=document.getElementById('seniorManagerDashTo');
  const from=fromEl?.value||'';
  const to=toEl?.value||'';
  const sites=[...new Set([...siteNames(),...(state.seniorManagerInspections||[]).map(s=>s.site).filter(Boolean)])].sort((a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'}));
  if(siteEl){
    siteEl.innerHTML='<option value="">All sites</option>'+sites.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
    if(sites.includes(selected))siteEl.value=selected;
  }
  const filter=siteEl?.value||'';
  const rows=(state.seniorManagerInspections||[]).filter(s=>
    (!filter||s.site===filter) &&
    (!from||String(s.date||'')>=from) &&
    (!to||String(s.date||'')<=to)
  ).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  let note=seniorManagerTableError?`<div class="statusbox"><strong>Shared Senior Manager inspection table unavailable.</strong><div class="mini">Run <code>dgs-senior-manager-inspections.sql</code> once in Supabase, then refresh. Details: ${esc(seniorManagerTableError)}</div></div>`:'';
  host.innerHTML=note+(rows.length?rows.map(s=>{
    const answers=Object.values(s.answers||{});const noCount=answers.filter(x=>x==='No').length;const pending=s._pendingSync?'<div class="sup-record-status">Pending shared sync</div>':'';
    return `<div class="dayrow"><div><strong>${esc(s.site||'Site not recorded')}</strong><div class="mini">${esc(s.date||'')} • ${esc(s.inspector||'')}</div><div class="mini">${answers.filter(x=>x==='Yes').length} Yes · ${noCount} No · ${answers.filter(x=>x==='N/A').length} N/A</div>${pending}</div><div class="actions"><button class="primary" onclick="editSeniorManagerInspection('${esc(s.id)}')">Open / edit</button></div></div>`;

function seniorManagerAddPhotos(key,files){
  if(!seniorManagerCurrent||!files?.length)return;
  captureSeniorManagerFormFields();
  const competencyMatch=String(key).match(/^__competency__(\d+)$/);
  if(key==='__additional__')seniorManagerCurrent.additionalPhotos??=[];
  else if(competencyMatch){seniorManagerCurrent.competencyChecks??=[];const ci=Number(competencyMatch[1]);seniorManagerCurrent.competencyChecks[ci]??={name:'',validCompetency:'',comment:'',photos:[]};seniorManagerCurrent.competencyChecks[ci].photos??=[]}
  else {seniorManagerCurrent.photos??={};seniorManagerCurrent.photos[key]??=[]}
  const list=[...files];let remaining=list.length,added=0,failed=0;
  const finish=()=>{
    if(remaining<=0){
      renderSeniorManagerForm(seniorManagerCurrent);
      if(failed&&added===0)toast('Photo could not be processed on this device. Try another photo or select a JPEG image.');
      else if(added)toast(`${added} photo${added===1?'':'s'} added`);
    }
  };
  list.forEach(file=>{
    const isImage=(file.type||'').startsWith('image/')||/\.(jpe?g|png|webp|gif)$/i.test(file.name||'');
    if(!isImage){failed++;remaining--;finish();return}
    const reader=new FileReader();reader.onerror=()=>{failed++;remaining--;finish()};
    reader.onload=e=>compressPhoto(e.target.result,src=>{if(key==='__additional__')seniorManagerCurrent.additionalPhotos.push(src);else if(competencyMatch)seniorManagerCurrent.competencyChecks[Number(competencyMatch[1])].photos.push(src);else seniorManagerCurrent.photos[key].push(src);added++;remaining--;finish()},()=>{failed++;remaining--;finish()});
    reader.readAsDataURL(file);
  });
}

function emailSeniorManagerReport(){

    bodyLines.push('','----------------------------------------','');
  });
  const recipients=[...new Set(ids.map(v=>String(v||'').replace(/[\r\n;]/g,'').trim()).filter(Boolean))];
  const to=recipients.join('; ');

  if(!data || !data.token) throw new Error('Mileage access could not be created. Run dgs-mileage-tracking.sql in Supabase first.');
  return data;
}

function ensureMileageSessionForCurrentRole(){
  if(mileageSession?.token)return true;

}
async function loadMileageRowsFromCloud(){
  if(!ensureMileageSessionForCurrentRole())return false;
  const {data,error}=await db.rpc('dgs_mileage_list',{p_token:mileageSession.token});
  if(error)throw new Error(error.message||'Could not load mileage reports.');
  let rows=data||[];
  if(typeof rows==='string'){try{rows=JSON.parse(rows)}catch(_){rows=[]}}
  if(!Array.isArray(rows))throw new Error('The mileage report response was not in the expected format.');
  mileageRows=rows.map(row=>{
    let d=row.data&&typeof row.data==='object'?row.data:{};
    if(typeof d==='string'){try{d=JSON.parse(d)}catch(_){d={}}}
    return {...d,id:String(row.id),employeeId:row.employee_id||d.employeeId||'',employeeName:row.employee_name||d.employeeName||'Employee',date:String(row.journey_date||d.date||''),startPostcode:row.start_postcode||d.startPostcode||'',endPostcode:row.end_postcode||d.endPostcode||'',distanceMiles:Number(row.distance_miles??d.distanceMiles??0),method:row.distance_method||d.method||'fastest_road_route'};
  });
  return true;
}

  if(!ensureMileageSessionForCurrentRole()){

async function mileageEmployeeAdminRpc(action, extra={}){

  }

    p_token:mileageSession.token,
    p_action:action,
    p_employee_name:extra.employeeName??null,
    p_pin:extra.pin??null,
    p_employee_id:extra.employeeId??null,
    p_active:extra.active??null
  });
  if(error)throw new Error(error.message||'Employee account action failed.');
  return mileageParseRpcJson(data);
}

async function submitMileageEmployeePinReset(employeeId){
  const employee=mileageEmployeeAdminRows.find(e=>String(e.employee_id)===String(employeeId));

  const pin=String(document.getElementById('mileageEmployeeResetPin')?.value||'').replace(/\\D/g,'').slice(0,4);
  if(pin.length!==4){showMileageEmployeeAdminMessage('Enter a new 4-digit employee PIN.');return}

async function createMileageEmployee(){
  const nameInput=document.getElementById('newMileageEmployeeName');
  const pinInput=document.getElementById('newMileageEmployeePin');
  const btn=document.getElementById('createMileageEmployeeBtn');
  const name=String(nameInput?.value||'').trim();
  const pin=String(pinInput?.value||'').replace(/\\D/g,'').slice(0,4);
  const msg=document.getElementById('mileageEmployeeAdminMessage');
  if(msg){msg.textContent='';msg.className='login-error';msg.style.display='none'}
  if(!name){showMileageEmployeeAdminMessage('Enter the employee name.');return}
  if(pin.length!==4){showMileageEmployeeAdminMessage('Enter a 4-digit employee PIN.');return}
  if(btn)btn.disabled=true;
  try{
    const result=await mileageEmployeeAdminRpc('create',{employeeName:name,pin});
    if(!result?.ok)throw new Error('The employee account could not be created.');
    if(nameInput)nameInput.value='';
    if(pinInput)pinInput.value='';
    showMileageEmployeeAdminMessage(`Employee account created for ${name}. The assigned PIN is ${pin}. Give it to the employee now; it will not be shown again.`,true);
    try{await refreshMileageEmployeeAdminRows()}catch(refreshError){console.error('Employee created but list refresh failed',refreshError)}
  }catch(e){
    console.error('Create mileage employee failed',e);
    showMileageEmployeeAdminMessage(e?.message||'Could not create employee account.');
  }finally{
    const currentBtn=document.getElementById('createMileageEmployeeBtn');
    if(currentBtn)currentBtn.disabled=false;
  }
}
async function setMileageEmployeeActive(employeeId,active){
  const employee=mileageEmployeeAdminRows.find(e=>String(e.employee_id)===String(employeeId));
  if(!employee)return;
  if(!active&&!confirm(`Deactivate ${employee.employee_name}? They will no longer be able to sign in to Mileage Tracking.`))return;

  }catch(e){
    console.error('Update mileage employee status failed',e);
    toast(e?.message||'Could not update employee account.');
  }
}

function updateMileageField(key,value){if(mileageCurrent){mileageCurrent[key]=value;persistMileageDraft()}}
function cancelMileageForm(){if(mileageWatchId!==null&&navigator.geolocation){try{navigator.geolocation.clearWatch(mileageWatchId)}catch(_){}}mileageWatchId=null;mileageTracking=false;releaseMileageWakeLock();clearMileageDraft();mileageCurrent=null;openMileageDashboard()}
function getMileagePosition(options={enableHighAccuracy:true,timeout:15000,maximumAge:0}){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation)return reject(new Error('This device or browser does not support GPS location.'));
    navigator.geolocation.getCurrentPosition(resolve,e=>reject(new Error(e.code===1?'Location permission was denied. Allow location access in the browser settings.':e.code===2?'Current location is unavailable. Check GPS/location settings.':'Timed out getting GPS location. Try again or enter a postcode manually.')),options);
  });
}
async function mileagePostcodeFromCoords(coords){
  const url=`https://api.postcodes.io/postcodes?lon=${encodeURIComponent(coords.longitude??coords.lon)}&lat=${encodeURIComponent(coords.latitude??coords.lat)}`;
  const response=await fetch(url);if(!response.ok)throw new Error('Postcode lookup service is unavailable.');
  const result=await response.json();const postcode=result?.result?.[0]?.postcode;
  if(!postcode)throw new Error('No nearby postcode was returned. Enter the postcode manually.');return postcode;
}
async function useMileageLocation(which){
  if(!mileageCurrent)return;
  try{
    const pos=await getMileagePosition();const coords={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy||null};
    if(which==='start'){mileageCurrent.startCoords=coords;}else{mileageCurrent.endCoords=coords;}
    try{const postcode=await mileagePostcodeFromCoords(coords);if(which==='start')mileageCurrent.startPostcode=postcode;else mileageCurrent.endPostcode=postcode;}
    catch(e){toast('GPS position captured. '+(e?.message||'Enter the postcode manually.'));}
    const input=document.getElementById(which==='start'?'mileageStartPostcode':'mileageEndPostcode');if(input)input.value=which==='start'?mileageCurrent.startPostcode:mileageCurrent.endPostcode;
    toast('Device location captured.');
  }catch(e){toast(e?.message||String(e))}
}
async function mileageGeocodePostcode(postcode,existingCoords){
  if(existingCoords && Number.isFinite(Number(existingCoords.lat)) && Number.isFinite(Number(existingCoords.lon)))return {latitude:Number(existingCoords.lat),longitude:Number(existingCoords.lon)};
  const cleaned=String(postcode||'').trim();if(!cleaned)throw new Error('Enter both postcodes or capture both locations first.');
  const response=await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(cleaned)}`);
  if(!response.ok)throw new Error(`Could not find postcode ${cleaned}. Check the postcode and try again.`);
  const payload=await response.json();if(payload.status!==200||!payload.result)throw new Error(`Could not find postcode ${cleaned}.`);
  return {latitude:Number(payload.result.latitude),longitude:Number(payload.result.longitude)};
}
function openMileageGoogleMaps(){
  if(!mileageCurrent)return;

  const end=String(document.getElementById('mileageEndPostcode')?.value||mileageCurrent.endPostcode||'').trim();
  if(!start||!end){toast('Enter both start and destination postcodes first.');return}
  mileageCurrent.startPostcode=start;
  mileageCurrent.endPostcode=end;
  mileageCurrent.method='google_maps_manual';
  // Clear any other route engine's distance so it cannot be mistaken for the
  // Google Maps mileage when the employee returns to the form.
  mileageCurrent.distanceMiles='';

  if(distance)distance.value='';
  const status=document.getElementById('mileageRouteStatus');
  if(status)status.textContent='Google Maps route opened. Enter the driving distance shown in Google Maps into Distance (miles) above before saving.';
  const url='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(start)+'&destination='+encodeURIComponent(end)+'&travelmode=driving';
  const mapWindow=window.open(url,'_blank');
  if(mapWindow){try{mapWindow.opener=null}catch(_){}}
  toast('Google Maps opened. Enter its driving distance in the mileage form.');

async function calculateMileageRoadRoute(){
  if(!mileageCurrent)return;
  mileageCurrent.startPostcode=String(document.getElementById('mileageStartPostcode')?.value||mileageCurrent.startPostcode||'').trim();
  mileageCurrent.endPostcode=String(document.getElementById('mileageEndPostcode')?.value||mileageCurrent.endPostcode||'').trim();
  const status=document.getElementById('mileageRouteStatus');if(status)status.textContent='Looking up postcodes and planning a route that favours motorways and main roads…';
  try{
    if(!mileageCurrent.startPostcode||!mileageCurrent.endPostcode)throw new Error('Enter both start and destination postcodes first.');
    const [start,end]=await Promise.all([mileageGeocodePostcode(mileageCurrent.startPostcode,mileageCurrent.startCoords),mileageGeocodePostcode(mileageCurrent.endPostcode,mileageCurrent.endCoords)]);
    // Valhalla's automobile costing favours higher-class roads. Set use_highways
    // to its maximum preference so motorways/trunk roads are strongly favoured;
    // its auto model also favours higher road classifications (including major A roads)
    // before falling back to lower-class roads for access or where the route requires it.
    const routeRequest={
      locations:[
        {lat:start.latitude,lon:start.longitude},
        {lat:end.latitude,lon:end.longitude}
      ],
      costing:'auto',
      costing_options:{auto:{use_highways:1.0,maneuver_penalty:10.0}},
      units:'miles',
      directions_options:{units:'miles'}
    };
    const url=`https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(routeRequest))}`;
    const response=await fetch(url);
    if(!response.ok)throw new Error('The main-road routing service is unavailable. Try again or record the actual trip using GPS tracking.');
    const data=await response.json();
    const summary=data?.trip?.summary;
    if(!summary||!Number.isFinite(Number(summary.length)))throw new Error(data?.error||data?.trip?.status_message||'A main-road driving route could not be found between those postcodes.');
    const routeLength=Number(summary.length);
    const routeUnits=String(data?.trip?.units||'miles').toLowerCase();
    const miles=routeUnits.startsWith('mile')?routeLength:routeLength*0.621371;
    mileageCurrent.distanceMiles=miles.toFixed(2);mileageCurrent.method='preferred_road_route';
    const distance=document.getElementById('mileageDistance');if(distance)distance.value=mileageCurrent.distanceMiles;
    if(status)status.textContent=`Motorway/main-road preferred route calculated: ${mileageCurrent.distanceMiles} miles. The route uses lower-class roads where required for local access.`;
    toast('Motorway/main-road preferred mileage calculated.');
  }catch(e){if(status)status.textContent=e?.message||String(e);toast(e?.message||String(e))}
}
function mileageHaversineMiles(a,b){
  const rad=v=>v*Math.PI/180;const lat1=Number(a.lat),lat2=Number(b.lat),dLat=rad(lat2-lat1),dLon=rad(Number(b.lon)-Number(a.lon));
  const x=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
  return 3958.7613*2*Math.atan2(Math.sqrt(x),Math.sqrt(Math.max(0,1-x)));
}
function mileageTrackDistance(points){let miles=0;for(let i=1;i<points.length;i++)miles+=mileageHaversineMiles(points[i-1],points[i]);return miles}
function addMileageTrackPoint(pos){
  if(!mileageCurrent)return;
  const point={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy||null,time:new Date(pos.timestamp||Date.now()).toISOString()};
  const points=mileageCurrent.trackPoints||(mileageCurrent.trackPoints=[]);const prev=points[points.length-1];
  if(!prev||mileageHaversineMiles(prev,point)>=0.003||Date.now()-new Date(prev.time).getTime()>10000)points.push(point);
  const miles=mileageTrackDistance(points);const preview=document.getElementById('mileageGpsPreview');if(preview)preview.textContent=`${points.length} route points recorded · approx. ${miles.toFixed(2)} miles so far.`;
  const label=document.getElementById('mileageTrackingStatus');if(label)label.textContent='Recording GPS route points…';
  persistMileageDraft();
}
const MILEAGE_DRAFT_KEY='dgs_mileage_active_route_v82';
let mileageWakeLock=null;
let mileageLastVisibleAt=Date.now();
function persistMileageDraft(){
  try{if(mileageCurrent&&mileageTracking){localStorage.setItem(MILEAGE_DRAFT_KEY,JSON.stringify({record:mileageCurrent,savedAt:Date.now(),tracking:true}));}}
  catch(e){console.warn('Could not persist mileage route locally',e)}
}
function clearMileageDraft(){try{localStorage.removeItem(MILEAGE_DRAFT_KEY)}catch(_){}}
async function requestMileageWakeLock(){
  try{if('wakeLock' in navigator && document.visibilityState==='visible')mileageWakeLock=await navigator.wakeLock.request('screen');}
  catch(e){console.warn('Screen wake lock unavailable',e)}

async function releaseMileageWakeLock(){try{if(mileageWakeLock){await mileageWakeLock.release();mileageWakeLock=null}}catch(_){}}
function restartMileageWatch(){
  if(!mileageTracking||!mileageCurrent||!navigator.geolocation||mileageWatchId!==null)return;
  mileageWatchId=navigator.geolocation.watchPosition(addMileageTrackPoint,e=>{
    const label=document.getElementById('mileageTrackingStatus');
    if(label)label.textContent=e.code===1?'Location permission was denied. Allow location access.':'GPS temporarily unavailable. Waiting for location updates…';
  },{enableHighAccuracy:true,maximumAge:2000,timeout:25000});

function renderMileageRouteMap(points){
  const el=document.getElementById('mileageRouteMap');if(!el||!Array.isArray(points)||points.length<2)return;
  if(typeof L==='undefined'){el.innerHTML='<p style="padding:12px">Map library could not load. Your GPS route points are still saved with the journey.</p>';return;}
  try{
    if(el._leaflet_id){el.innerHTML='';}
    const coords=points.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))).map(p=>[Number(p.lat),Number(p.lon)]);
    if(coords.length<2){el.innerHTML='<p style="padding:12px">Not enough valid GPS points to draw a route.</p>';return;}
    const map=L.map(el,{scrollWheelZoom:false}).setView(coords[0],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    const line=L.polyline(coords,{color:'#087f23',weight:5,opacity:.9}).addTo(map);
    L.marker(coords[0]).addTo(map).bindPopup('Journey start');
    L.marker(coords[coords.length-1]).addTo(map).bindPopup('Journey finish');
    map.fitBounds(line.getBounds().pad(.15));setTimeout(()=>map.invalidateSize(),100);
  }catch(e){console.warn('Could not draw mileage route',e);el.innerHTML='<p style="padding:12px">Could not display map. The GPS route points remain saved with the journey.</p>';}
}
document.addEventListener('visibilitychange',()=>{

  if(mileageTracking&&mileageCurrent){

    restartMileageWatch();

  }
});

async function startMileageTracking(){
  if(!mileageCurrent||mileageTracking)return;
  try{
    const pos=await getMileagePosition();
    mileageCurrent.startCoords={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy||null};
    mileageCurrent.trackPoints=[{lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy||null,time:new Date(pos.timestamp||Date.now()).toISOString()}];
    try{mileageCurrent.startPostcode=await mileagePostcodeFromCoords(mileageCurrent.startCoords)}catch(e){toast('GPS started. Please enter the start postcode manually if lookup is unavailable.')}

}
async function stopMileageTracking(){

  mileageCurrent.distanceMiles=miles.toFixed(2);mileageCurrent.method='gps_tracked';
  renderMileageForm();
  const startInput=document.getElementById('mileageStartPostcode');if(startInput)startInput.value=mileageCurrent.startPostcode||'';

async function saveMileageJourney(){

function renderArchivedPlantSection(){

async function archivePlant(pid){

  const p=state.plants.find(x=>String(x.id)===String(pid));
  if(!p||p.archived){toast('Active plant not found');return}
  if(!window.confirm(`Archive ${p.name||'this plant'}? It will be removed from active plant lists, but its inspection history will be retained.`))return;
  p.archived=true;p._pendingSync=true;saveLocal();
  await persistArchiveChange(p,'archived');
}
async function unarchivePlant(pid){
  if(!requirePermission('plant.manage','Only authorised management roles can restore archived plant.'))return;
  const p=state.plants.find(x=>String(x.id)===String(pid));
  if(!p||!p.archived){toast('Archived plant not found');return}

  p.archived=false;p._pendingSync=true;saveLocal();
  await persistArchiveChange(p,'restored');

async function persistArchiveChange(p,action){
  if(centralEnabled){
    try{
      const row={id:p.id,plant_list:p.list||'DGS Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',serial_number:p.serial||'',is_archived:!!p.archived,updated_at:new Date().toISOString()};
      const {error}=await db.from('plants').upsert([row],{onConflict:'id'});
      if(error)throw error;
      delete p._pendingSync;
      saveLocal();
      await loadFromCloud();
      toast(action==='archived'?'Plant archived':'Plant returned to active plant');
    }catch(e){
      console.warn('Plant archive change not synced',e);
      saveLocal();
      toast(`Plant ${action==='archived'?'archived':'restored'} on this device but shared sync failed: ${e?.message||e}. Check the archive SQL has been run.`);
    }
  }else{
    delete p._pendingSync;saveLocal();toast(action==='archived'?'Plant archived on this device':'Plant returned to active plant on this device');
  }
  home();
}

async function savePlant(){
  const operatorOnly=currentRole==='operator';
  if(operatorOnly){if(!can('plant.hire.add')){toast('You do not have access to add plant.');return}}
  else if(!requirePermission('plant.manage'))return;
  const list=operatorOnly?'Hired Plant':(val('plist')||'DGS Plant');
  const p={id:uid(),list:list,name:val('pname'),type:val('ptype'),site:val('psite'),make:val('pmodel'),serial:val('pserial'),archived:false,_pendingSync:true};
  if(!p.type||!p.name){toast('Enter plant name and type');return}
  state.plants.push(p);saveLocal();
  if(centralEnabled){
    const wasBusy=cloudSyncBusy;cloudSyncBusy=true;
    try{
      if(operatorOnly){
        // The general sync intentionally only upserts plant rows for management roles.
        // Operators can add hired plant, so upload that one row directly to Supabase.
        const row={id:p.id,plant_list:'Hired Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',serial_number:p.serial||'',is_archived:!!p.archived,updated_at:new Date().toISOString()};
        const {error}=await db.from('plants').upsert([row],{onConflict:'id'});
        if(error)throw error;
      }else{
        await syncStateToCloud();
      }
      delete p._pendingSync;
      saveLocal();
      await loadFromCloud();
    }catch(e){
      console.warn('Plant shared save failed',e);
      saveLocal();
      toast('Plant is saved on this device but has not synced to all devices: '+(e?.message||String(e)));
      home();
      return;
    }finally{cloudSyncBusy=wasBusy;}
  }else{
    // No central configuration: retain this record locally until cloud is configured.
    saveLocal();
  }
  toast(operatorOnly?'Hired plant saved and synced':'Plant saved and synced');home()
}

function compressPhoto(data,done,fail){

    try{
      const max=960;
      const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
      c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
      const ctx=c.getContext('2d',{alpha:false});
      if(!ctx)throw new Error('Canvas unavailable');
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(blob=>{
        if(!blob){fail?.();return}
        const fr=new FileReader();
        fr.onerror=()=>fail?.();
        fr.onload=()=>done(fr.result);
        fr.readAsDataURL(blob);
      },'image/jpeg',0.58);
    }catch(e){console.warn('Photo compression failed',e);fail?.()}
  };
  img.onerror=()=>{console.warn('Image decode failed');fail?.()};
  img.src=data;

      else console.warn('Pending plant shared sync failed',error);
    }
    // Retry locally retained supervisor inspections as well.
    for(const s of (state.supervisorInspections||[]).filter(x=>x&&x._pendingSync)){
      try{await syncSupervisorInspectionToCloud(s);delete s._pendingSync}
      catch(e){console.warn('Pending supervisor inspection sync failed',e)}
    }
    for(const s of (state.seniorManagerInspections||[]).filter(x=>x&&x._pendingSync)){
      try{await syncSeniorManagerInspectionToCloud(s);delete s._pendingSync}
      catch(e){console.warn('Pending senior manager inspection sync failed',e)}
    }
    saveLocal();
    await loadFromCloud();
    if(document.getElementById('todayList')){
      populateDashboardFilters();
      renderDashboard();
    }
    if(document.getElementById('supervisorDashboard'))renderSupervisorDashboard();
    if(document.getElementById('seniorManagerDashboard'))renderSeniorManagerDashboard();
  }catch(e){console.warn('Automatic shared-data sync failed',e)}
  finally{autoSyncBusy=false;}
}
function setupRealtimeSync(){
  if(!centralEnabled || !db || realtimeChannel) return;
  try{
    realtimeChannel=db.channel('dgs-puwer-live-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'plants'},()=>autoSyncDashboard())
      .on('postgres_changes',{event:'*',schema:'public',table:'inspections'},()=>autoSyncDashboard())
      .on('postgres_changes',{event:'*',schema:'public',table:'supervisor_inspections'},()=>autoSyncDashboard())
      .on('postgres_changes',{event:'*',schema:'public',table:'senior_manager_inspections'},()=>autoSyncDashboard())
      .subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Supabase Realtime unavailable; 5-second polling remains active')});
  }catch(e){console.warn('Realtime setup failed; 5-second polling remains active',e)}
}
window.addEventListener('pageshow',()=>autoSyncDashboard());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')autoSyncDashboard()});
setInterval(autoSyncDashboard,5000);
async function bootDgsApp(){
  if(!centralEnabled){loginScreen('Central Supabase configuration is missing.');return;}
  try{
    // V44 temporary PIN access uses the Supabase anon role, not Supabase
    // Anonymous Auth. Clear any anonymous Auth session left by V39-V43 so the
    // existing shared PUWER database permissions are used again.
    const {data:{session}}=await db.auth.getSession();
    if(session?.user){
      try{await db.auth.signOut()}catch(_){}
    }
    loginScreen();
  }catch(e){
    console.error(e);
    loginScreen('Unable to connect to the DGS access service.');
  }
}
bootDgsApp();
</script></body></html>
