<script>

const UNIVERSAL=[
"Operator’s manual, inspection records and required examination/certification available and in date",

const SPEC={
"Excavator":"Boom/dipper/bucket, slew area, slew lock, track condition, quick hitch and auxiliary lines",
"Dozer":"Blade, push arms, ripper, tracks, access/egress and reversing visibility",
"Piling rig":"Mast/leader, ropes/chains, winches, crowd system, stability/levelling, guards and emergency stops",
"Articulated dump truck (ADT)":"Articulation joint/lock, body and tailgate, hoist, tyres, brakes, steering and body-down indicator",

"Silo":"Road-going chassis, tyres, wheels and wheel nuts, service/parking brakes, road lights and reflectors, landing legs and supports, tank integrity, pressure gauges and relief/venting devices, loading/discharge valves, delivery hoses/couplings/clamps, air lines, onboard engine and fuel/oil/coolant, compressor/blower, pressure build-up and controls, guards, emergency stop, dust containment and safe discharge area",
"Generator":"Electrical enclosure, outlets, leads, earthing arrangements, emergency stop, ventilation and fuel system",
"Pump":"Suction/discharge hoses, couplings, guards, priming, strainers, leaks and safe discharge route",
"Fuel tank / bowser":"Tank integrity, bunding, cap/vents, hose/nozzle, valves, labels, earthing and spill equipment",
"Vacuum tank":"Tank condition, vacuum/pressure controls, relief devices, hoses, closures, valves and contents identification",
"Tractor":"Three-point linkage, PTO guard, drawbar, hydraulics, tyres, brakes and road/field lighting",
"Roller":"Drum/tyres, scraper bars, vibration system, water spray, articulation and edge visibility",
"Telehandler":"Boom/forks, carriage and locking, load chart, rated capacity indicator/limiter, stabilisers and attachment recognition",
"ATV":"Tyres, steering, brakes, throttle return, guards, racks, lights and operator protection specified by manufacturer",
"Loading shovel":"Loader arms, bucket, linkage, articulation joint/lock, tyres and reversing aids",
"Crusher":"Feed hopper, guards, conveyors, pull wires/interlocks, emergency stops, blockages and dust suppression",
"Screener":"Decks, guards, conveyors, belts/rollers, emergency stops, access platforms and dust controls",
"Wirtgen / milling machine":"Milling drum and guards, conveyors, water spray, levelling sensors, emergency stops and edge protection",
"Tractor and spreader":"PTO/drive guards, hopper/body, spreader mechanism, calibration/controls, hydraulics and exclusion area",
"Tractor and Stehr dust free stabiliser":"PTO and drive guards, three-point linkage, hydraulic connections, stabiliser rotor and housing, dust-control system, hoses, spray nozzles, hopper, controls and exclusion area"
};
const DEFAULT_RECIPIENTS=[
['Plant Manager','craig@dgs.co.uk'],['Plant dept','plant@dgs.co.uk'],['HSE','mick@dgs.co.uk'],['HSE Admin','simona@dgs.co.uk'],
['Site manager','Brandon.Hayes@dgs.co.uk'],['Site manager','Craig.Ackerman@dgs.co.uk'],['Site manager','George@dgs.co.uk'],['Site manager','Ian@dgs.co.uk'],['Site manager','Jim@dgs.co.uk'],['Site manager','Phillip@dgs.co.uk'],['Site manager','Shaun.Elliot@dgs.co.uk'],['Site manager','Shaun@dgs.co.uk']];
const KEY='dgs-puwer-v3';
function uid(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
let state=JSON.parse(localStorage.getItem(KEY)||'null');
if(!state){const old=localStorage.getItem('dgs-puwer-v2')||localStorage.getItem('dgs-puwer-v1'); state=old?JSON.parse(old):{plants:[],inspections:[],recipients:DEFAULT_RECIPIENTS};}
state.plants??=[];state.inspections??=[];state.supervisorInspections??=[];state.recipients??=DEFAULT_RECIPIENTS;
// Rename the former long silo-trailer label without losing existing plant records.
state.plants.forEach(p=>{if(p&&p.type==='Dry powder silo road-going trailer')p.type='Silo'});
let db=null, centralEnabled=false;
let cloudSyncBusy=false;
let supervisorTableError='';
let supervisorCurrent=null;
let realtimeChannel=null;
let currentUser=null;
let currentProfile=null;
let currentRole='';
let currentModule='portal';
let localAccessMode=false;
const ROLE_LABELS={admin:'Admin',plant_department:'Plant department',site_management:'Site management team',engineering_department:'Engineering department',operator:'Plant operator'};
const ROLE_PERMISSIONS={
  admin:new Set(['puwer.view','puwer.inspect','plant.manage','plant.hire.add','reports.view','hire.view','hire.manage','supervisor.view','supervisor.manage']),
  plant_department:new Set(['puwer.view','puwer.inspect','plant.manage','plant.hire.add','reports.view','hire.view','hire.manage','supervisor.view','supervisor.manage']),
  site_management:new Set(['puwer.view','puwer.inspect','plant.manage','plant.hire.add','reports.view','hire.view','hire.manage','supervisor.view','supervisor.manage']),
  engineering_department:new Set(['puwer.view','puwer.inspect','plant.manage','plant.hire.add','reports.view','hire.view','hire.manage','supervisor.view','supervisor.manage']),
  operator:new Set(['puwer.view','puwer.inspect','plant.hire.add'])
};
try{ if(window.DGS_SUPABASE_URL && window.DGS_SUPABASE_KEY && window.supabase){ db=window.supabase.createClient(window.DGS_SUPABASE_URL,window.DGS_SUPABASE_KEY); centralEnabled=true; } }catch(e){ console.warn('Central database disabled',e); }
function saveLocal(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}
  catch(e){
    // Mobile browsers can have a much smaller/less predictable localStorage quota.
    // Keep the lightweight inspection data locally and rely on Supabase for photos.
    try{
      const safe=JSON.parse(JSON.stringify(state,(k,v)=>{
        if(k==='checkPhotos')return undefined;
        if(k==='photos' || k==='additionalPhotos')return undefined;
        return v;
      }));
      localStorage.setItem(KEY,JSON.stringify(safe));
      console.warn('Local device cache trimmed because storage quota was reached',e);
      return false;
    }catch(e2){
      console.warn('Could not save local device cache',e2);
      return false;
    }
  }
}
function save(){saveLocal();}
async function loadFromCloud(){
  if(!centralEnabled) return;
  let plantsData=null, plantsError=null, inspData=null, inspError=null;
  const [{data:ps,error:pe},{data:is,error:ie}]=await Promise.all([
    db.from('plants').select('*').order('created_at'),
    db.from('inspections').select('*').order('inspection_date')
  ]);
  plantsData=ps||[]; plantsError=pe; inspData=is||[]; inspError=ie;

  // The temporary PIN/anonymous role setup can make direct table reads return an
  // empty set on projects where the access-control SQL has not fully propagated.
  // Try the secure bootstrap RPC as a fallback before deciding that the cloud is empty.
  if((plantsError || inspError || ((!plantsData.length && !inspData.length) && (state.plants.length || state.inspections.length)))){
    try{
      const {data:boot,error:be}=await db.rpc('dgs_get_puwer_bootstrap');
      if(!be && boot){
        plantsData=Array.isArray(boot.plants)?boot.plants:plantsData;
        inspData=Array.isArray(boot.inspections)?boot.inspections:inspData;
        plantsError=null; inspError=null;
      }
    }catch(e){console.warn('Bootstrap RPC unavailable',e)}
  }
  if(plantsError) throw plantsError;
  if(inspError) throw inspError;

  const pendingPlants=(state.plants||[]).filter(p=>p&&p._pendingSync);
  const cloudPlants=(plantsData||[]).map(p=>({id:p.id,list:p.plant_list,name:p.fleet_name,type:(p.plant_type==='Dry powder silo road-going trailer'?'Silo':p.plant_type),site:p.site,make:p.make_model,serial:p.serial_number||''}));
  const cloudInspections=(inspData||[]).map(i=>{const d=i.data||{};d.id=i.id;d.plantId=i.plant_id;d.date=i.inspection_date;d.time=i.inspection_time;d.createdBy=i.created_by||d.createdBy||'';return d});

  // Never erase a known local dataset because a cloud query temporarily returned no rows.
  // Keep new plant records visible on this device until the shared-table upsert succeeds.
  if(cloudPlants.length || state.plants.length===0){
    const cloudIds=new Set(cloudPlants.map(p=>String(p.id)));
    state.plants=[...cloudPlants,...pendingPlants.filter(p=>!cloudIds.has(String(p.id)))];
  }else if(pendingPlants.length){
    const existingIds=new Set(state.plants.map(p=>String(p.id)));
    state.plants.push(...pendingPlants.filter(p=>!existingIds.has(String(p.id))));
  }
  if(cloudInspections.length || state.inspections.length===0) state.inspections=cloudInspections;
  await loadSupervisorInspectionsFromCloud();
  saveLocal();
}
async function loadSupervisorInspectionsFromCloud(){
  if(!centralEnabled)return;
  try{
    const {data,error}=await db.from('supervisor_inspections').select('*').order('inspection_date',{ascending:false});
    if(error){supervisorTableError=error.message||'Supervisor inspection table is unavailable';console.warn('Supervisor inspection cloud load failed',error);return}
    supervisorTableError='';
    const cloud=(data||[]).map(row=>{
      const d=row.data&&typeof row.data==='object'?row.data:{};
      return {...d,id:row.id,site:row.site||d.site||'',inspector:row.inspector_name||d.inspector||'',date:row.inspection_date||d.date||''};
    });
    const pending=(state.supervisorInspections||[]).filter(s=>s&&s._pendingSync);
    if(cloud.length || (state.supervisorInspections||[]).length===0){
      const ids=new Set(cloud.map(s=>String(s.id)));
      state.supervisorInspections=[...cloud,...pending.filter(s=>!ids.has(String(s.id)))];
    }else if(pending.length){
      const ids=new Set((state.supervisorInspections||[]).map(s=>String(s.id)));
      state.supervisorInspections.push(...pending.filter(s=>!ids.has(String(s.id))));
    }
  }catch(e){supervisorTableError=e?.message||String(e);console.warn('Supervisor inspection cloud load failed',e)}
}
async function syncSupervisorInspectionToCloud(s){
  if(!centralEnabled)throw new Error('Central database is not configured');
  const data={...s};delete data._pendingSync;
  const row={id:String(s.id),site:s.site||'',inspector_name:s.inspector||'',inspection_date:s.date||dateNow(),data,updated_at:new Date().toISOString()};
  const {error}=await db.from('supervisor_inspections').upsert([row],{onConflict:'id'});
  if(error)throw error;
}
async function syncNormalizedInspectionToCloud(d){
  if(!centralEnabled)return;
  // The full inspection JSON in public.inspections.data is the source of truth
  // for photo attachments. Do not duplicate base64 photos into the normalized
  // tables because large photo payloads can cause operator saves to fail.
  const checkRows=[];
  UNIVERSAL.forEach((q,i)=>checkRows.push({inspection_id:d.id,check_key:'u'+i,check_number:String(i+1),check_item:q,result:d.checks?.[i]||'',comment:d.comments?.['u'+i]||'',photos:[]}));
  const plant=state.plants.find(p=>String(p.id)===String(d.plantId));
  checkRows.push({inspection_id:d.id,check_key:'spec',check_number:'P',check_item:SPEC[plant?.type]||'Plant-specific check',result:d.spec||'',comment:d.comments?.spec||'',photos:[]});
  const {error:ce}=await db.from('inspection_checks').upsert(checkRows,{onConflict:'inspection_id,check_key'});
  if(ce)throw ce;

  const {error:de}=await db.from('defects').delete().eq('inspection_id',d.id);
  if(de)throw de;
  const defects=(d.defects||[]).map(x=>({inspection_id:d.id,ref:String(x.ref??''),auto_key:x.autoKey||null,defect:x.defect||'',immediate_action:x.action||'',reported_to:x.reported||'',target_completion:x.target||'',closed_by:x.closed||''}));
  if(defects.length){
    const {error:die}=await db.from('defects').insert(defects);
    if(die)throw die;
  }
}
async function syncStateToCloud(){
  if(!centralEnabled)return;
  if(!can('plant.manage') && !can('puwer.inspect'))return;
  cloudSyncBusy=true;
  try{
    if(can('plant.manage')){
      const plantRows=state.plants.map(p=>({id:p.id,plant_list:p.list||'DGS Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',serial_number:p.serial||'',updated_at:new Date().toISOString()}));
      if(plantRows.length){const {error}=await db.from('plants').upsert(plantRows,{onConflict:'id'});if(error)throw error;}
    }
    const inspRows=state.inspections.map(d=>({id:d.id,plant_id:d.plantId,inspection_date:d.date,inspection_time:d.time||'',created_by:(d.createdBy||((currentUser?.id && !localAccessMode)?currentUser.id:null)),data:d,updated_at:new Date().toISOString()}));
    if(inspRows.length){const {error}=await db.from('inspections').upsert(inspRows,{onConflict:'id'});if(error)throw error;}

async function startDgsAccess(role){
  authFlowBusy=true;
  localAccessMode=true;
  currentRole=role;
  const roleNames={admin:'Admin',plant_department:'Plant department',site_management:'Site management team',engineering_department:'Engineering department',operator:'Plant operator'};
  currentProfile={full_name: roleNames[role]||'DGS user', role, active:true};
  currentUser=null;

  try{
    // Temporary PIN/operator mode intentionally uses the same Supabase anon
    // connection that the working PUWER app used before DGS account auth was
    // introduced. Do NOT create an anonymous Auth session here: doing so changes
    // Postgres from the anon role to authenticated and can block the existing
    // shared plant/inspection policies.
    if(centralEnabled){
      try{await db.auth.signOut();}catch(_){}
      try{await loadFromCloud()}catch(e){console.warn('Cloud data unavailable in temporary access mode',e);toast('Shared database could not be loaded. Check the V44 Supabase access SQL.')}
      try{setupRealtimeSync()}catch(_){}

}

async function handleAuthSession(session){
  if(authFlowBusy || localAccessMode)return;
  if(!session){
    currentUser=null;currentProfile=null;currentRole='';stopRealtimeSync();loginScreen();return;
  }
  // Anonymous sessions are not assigned a role until the user chooses an access level.
  if(session.user?.is_anonymous){
    currentUser=null;currentProfile=null;currentRole='';stopRealtimeSync();loginScreen();return;
  }
  try{

  }

  else {supervisorCurrent.photos??={};supervisorCurrent.photos[key]??=[]}

  const finish=()=>{
    if(remaining<=0){
      renderSupervisorForm(supervisorCurrent);
      if(failed&&added===0)toast('Photo could not be processed on this device. Try another photo or select a JPEG image.');
      else if(added)toast(`${added} photo${added===1?'':'s'} added`);

    if(!isImage){failed++;remaining--;finish();return}

function compressPhoto(data,done,fail){
  const img=new Image();
  img.decoding='async';
  img.onload=()=>{
    try{
      const max=960;
      const scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));
      c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
      const ctx=c.getContext('2d',{alpha:false});
      if(!ctx)throw new Error('Canvas unavailable');
      ctx.drawImage(img,0,0,c.width,c.height);
      c.toBlob(blob=>{
        if(!blob){fail?.();return}
        const fr=new FileReader();
        fr.onerror=()=>fail?.();
        fr.onload=()=>done(fr.result);
        fr.readAsDataURL(blob);
      },'image/jpeg',0.58);
    }catch(e){console.warn('Photo compression failed',e);fail?.()}
  };
  img.onerror=()=>{console.warn('Image decode failed');fail?.()};
  img.src=data;
}

function emailReport(){
  const checks=[...document.querySelectorAll('[data-report-r]:checked')];
  const ids=checks.map(x=>state.recipients[Number(x.dataset.reportR)]?.[1]).filter(Boolean);
  if(!ids.length){toast('Select at least one recipient');return}
  const reportRows=Array.isArray(window.reportRows)?window.reportRows:[];
  const isDefectInspection=(i)=>Array.isArray(i.defects)&&i.defects.length>0 || (Array.isArray(i.checks)&&i.checks.some(v=>String(v||'').trim().toLowerCase()==='defect')) || String(i.spec||'').trim().toLowerCase()==='defect';
  const entries=[];const seen=new Set();
  reportRows.filter(isDefectInspection).forEach(i=>{
    const p=state.plants.find(x=>String(x.id)===String(i.plantId));
    if(!p)return;
    const plantName=String(p.name||p.fleet||p.fleet_name||'Unnamed plant').trim();
    const plantType=String(p.type||p.plant_type||'Plant').trim();
    const site=String(i.details?.site||p.site||'Site not recorded').trim();
    const key=[String(i.plantId),site].join('|');
    if(seen.has(key))return;seen.add(key);
    entries.push(`- ${plantName} (${plantType}) — Site: ${site}`);
  });
  if(!entries.length){toast('No plant defects found in the generated report. Choose a date range or filters that include inspections with defects.');return}
  // Put each address in the mailto recipient list itself rather than a single
  // `to=` query value. Outlook was treating the query value as one invalid address.
  // Outlook recognises semicolons as recipient delimiters when they are in the
  // recipient portion of the mailto URI. Strip whitespace/control characters first.
  const cleanIds=[...new Set(ids.map(v=>String(v||'').replace(/[\r\n;]/g,'').trim()).filter(Boolean))];
  if(!cleanIds.length){toast('No valid recipients selected');return}
  const to=cleanIds.join(';');
  const subject=encodeURIComponent('DGS PLANT DEFECT');
  const body=encodeURIComponent('The following items of plant have been identified as having defects\n\n'+entries.join('\n'));
  window.location.href=`mailto:${to}?subject=${subject}&body=${body}`;
}

// Keep the dashboard synchronised with Supabase every 5 seconds.
// The polling is the reliable fallback for multi-device updates. Supabase Realtime
// is also enabled when available, so changes can appear immediately.
let autoSyncBusy=false;
async function autoSyncDashboard(){
  if(!centralEnabled || autoSyncBusy || cloudSyncBusy || current || currentModule==='supervisor-form') return;
  if(document.visibilityState !== 'visible') return;
  if(!document.getElementById('todayList') && !document.getElementById('supervisorDashboard')) return;
  autoSyncBusy=true;
  try{
    // Retry locally retained hired-plant records after mobile/offline save failures.
    for(const p of state.plants.filter(x=>x&&x._pendingSync)){
      const row={id:p.id,plant_list:p.list||'Hired Plant',site:p.site||'',plant_type:p.type||'',make_model:p.make||'',fleet_name:p.name||'',serial_number:p.serial||'',updated_at:new Date().toISOString()};
      const {error}=await db.from('plants').upsert([row],{onConflict:'id'});
      if(!error)delete p._pendingSync;
      else console.warn('Pending plant shared sync failed',error);
    }
    // Retry locally retained supervisor inspections as well.
    for(const s of (state.supervisorInspections||[]).filter(x=>x&&x._pendingSync)){
      try{await syncSupervisorInspectionToCloud(s);delete s._pendingSync}
      catch(e){console.warn('Pending supervisor inspection sync failed',e)}
    }
    saveLocal();
    await loadFromCloud();
    if(document.getElementById('todayList')){
      populateDashboardFilters();
      renderDashboard();
    }
    if(document.getElementById('supervisorDashboard'))renderSupervisorDashboard();
  }catch(e){console.warn('Automatic shared-data sync failed',e)}
  finally{autoSyncBusy=false;}
}
function setupRealtimeSync(){
  if(!centralEnabled || !db || realtimeChannel) return;
  try{
    realtimeChannel=db.channel('dgs-puwer-live-sync')
      .on('postgres_changes',{event:'*',schema:'public',table:'plants'},()=>autoSyncDashboard())
      .on('postgres_changes',{event:'*',schema:'public',table:'inspections'},()=>autoSyncDashboard())
      .on('postgres_changes',{event:'*',schema:'public',table:'supervisor_inspections'},()=>autoSyncDashboard())
      .subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Supabase Realtime unavailable; 5-second polling remains active')});
  }catch(e){console.warn('Realtime setup failed; 5-second polling remains active',e)}
}

async function bootDgsApp(){
  if(!centralEnabled){loginScreen('Central Supabase configuration is missing.');return;}
  try{
    // V44 temporary PIN access uses the Supabase anon role, not Supabase
    // Anonymous Auth. Clear any anonymous Auth session left by V39-V43 so the
    // existing shared PUWER database permissions are used again.
    const {data:{session}}=await db.auth.getSession();
    if(session?.user){
      try{await db.auth.signOut()}catch(_){}
    }
    loginScreen();
  }catch(e){
    console.error(e);
    loginScreen('Unable to connect to the DGS access service.');
  }
}
